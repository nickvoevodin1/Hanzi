    else{q=`<div class="ru big">${esc(c.m)}</div><div class="hint" style="text-align:center">черт: ${c.s}</div>`;a=`<div class="zh big">${radHtml(c)}</div><div class="py big">${c.p}</div>`}
    const used=Object.entries(C).filter(([ch,i])=>i.k===c.n).map(([ch])=>ch);
    if(used.length)a+=`<div class="hint" style="text-align:center">В ваших иероглифах: <span class="zh" style="font-size:22px">${used.map(ch=>`<span class="hz" data-c="${ch}">${ch}</span>`).join(" ")}</span></div>`;
  }else if(st.mode==="ru2zh"){
    src=c.src;q=`<div class="ru">${esc(c.ru)}</div><div class="hint">Напишите иероглифами с тонами</div>`;
    a=`<div class="zh mid">${wrap(c.zh)}</div><div class="py">${esc(c.py)}</div><button class="say" data-t="${esc(c.zh)}">▶ Слушать</button>`;
  }else if(st.mode==="zh2ru"){
    src=c.src;q=`<div class="zh mid">${wrap(c.zh)}</div><button class="say" data-t="${esc(c.zh)}">▶ Слушать</button>`;
    a=`<div class="py">${esc(c.py)}</div><div class="ru">${esc(c.ru)}</div>`;
  }else{
    src=c.src;q=`<div class="hint">Слушайте и записывайте иероглифами, ставьте тоны</div><div class="row" style="margin-top:0"><button class="btn main" id="p1">▶ Слушать</button><button class="btn" id="p2">🐢 Медленно</button></div>`;
    a=`<div class="zh mid">${wrap(c.zh)}</div><div class="py">${esc(c.py)}</div><div class="ru" style="font-size:15px;color:var(--muted)">${esc(c.ru)}</div>`;
  }
  v.innerHTML=`<div class="card"><div class="meta"><span>${esc(src)}</span><span>${st.i+1} / ${n}</span></div><div class="q">${q}${st.open?`<div class="ans">${a}</div>`:""}</div>
  <div class="row">${st.open?`<button class="btn no" id="no">Ещё раз</button><button class="btn ok" id="ok">Знаю</button>`:`<button class="btn main" id="show">Показать ответ</button>`}</div>
  <div class="bar"><i style="width:${st.i/n*100}%"></i></div></div>`;
  v.querySelectorAll(".say").forEach(b=>b.onclick=()=>say(b.dataset.t));bindHz(v);
  if($("#p1")){$("#p1").onclick=()=>say(c.zh,.8);$("#p2").onclick=()=>say(c.zh,.5);if(!st.open&&st.autoplay!==st.i){st.autoplay=st.i;say(c.zh,.8)}}
  if(st.open){$("#no").onclick=()=>{st.bad.push(c);mark(c,false);next()};$("#ok").onclick=()=>{st.good++;mark(c,true);next()}}
  else $("#show").onclick=()=>{st.open=true;render()};
}
function next(){st.i++;st.open=false;st.autoplay=-1;save();render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(st.mode==="test"||st.mode==="all"||!$("#sheet").classList.contains("hide"))return;if(e.key===" "||e.key==="Enter"){const b=$("#show");if(b){e.preventDefault();b.click()}}if(st.open){if(e.key==="ArrowRight")$("#ok")?.click();if(e.key==="ArrowLeft")$("#no")?.click()}});
// ======== ПРОВЕРОЧНАЯ: полный цикл ========
const TSTEPS=[["learn","Разбор"],["words","Слова"],["tones","Тоны"],["tiles","Порядок слов"],["hear","На слух → РУ"],["write","РУ → 中"],["dict","Диктант"]];
const TPATH=[];
TB.forEach((b,bi)=>{TSTEPS.forEach(([s,n])=>TPATH.push({id:b.id+":"+s,b:bi,s,n}));if([2,5,8,12].includes(bi))TPATH.push({id:"rev"+bi,s:"review",upto:bi,n:"Повторение: блоки 1–"+(bi+1)})});
TPATH.push({id:"exam",s:"exam",n:"Пробная контрольная"},{id:"final",s:"final",n:"Финальная проверка"});
const T={view:"home",p:null,q:[],total:0,err:0,first:0,firstOk:0,played:null};
const tDone=id=>!!tp[id];
const tNext=()=>TPATH.findIndex(p=>!tDone(p.id));
const TONE=["·","ˉ","ˊ","ˇ","ˋ"];
function tFrags(b){const o=[];b.units.forEach(u=>{(u.parts||[]).forEach(p=>o.push({ru:p[0],zh:p[1],py:p[2],src:b.title+", отрывок"}));o.push({ru:u.ru,zh:u.zh,py:u.py,src:b.title})});return o}
function tWholes(b){return b.units.map(u=>({ru:u.ru,zh:u.zh,py:u.py,src:b.title}))}
function tTasks(p){
  const b=TB[p.b];
  if(p.s==="words")return [...sh(b.words).map(w=>({k:"flash",dir:"zh",w})),...sh(b.words).map(w=>({k:"flash",dir:"ru",w}))];
  if(p.s==="tones")return b.units.map(u=>({k:"tone",u}));
  if(p.s==="tiles")return sh(b.tiles).map(t=>({k:"tiles",t}));
  if(p.s==="hear"||p.s==="write"||p.s==="dict")return tFrags(b).map(f=>({k:p.s,f}));
  if(p.s==="review"){const o=[];for(let i=0;i<=p.upto;i++)tWholes(TB[i]).forEach((f,j)=>o.push({k:j%2?"hear":"write",f}));return sh(o)}
  if(p.s==="exam"){const o=[];TB.forEach(b=>tFrags(b).forEach(f=>o.push({k:Math.random()<.5?"write":"hear",f})));return sh(o)}
  if(p.s==="final"){const o=[];TB.forEach(b=>tWholes(b).forEach(f=>{o.push({k:"write",f});o.push({k:"hear",f})}));return sh(o)}
  return [];
}
function tStart(i){
  const p=TPATH[i];T.p=i;T.err=0;T.first=0;T.firstOk=0;T.played=null;T.open=false;
  if(p.s==="learn"){T.view="learn";T.q=[];}else{T.view="run";T.q=tTasks(p);T.total=T.q.length;T.q.forEach(t=>t.tries=0)}
  tRender();window.scrollTo(0,0);
}
function tFinishStep(){const p=TPATH[T.p];tp[p.id]=true;if(p.s==="final")tp.finalScore=[T.firstOk,T.first];save();T.view="stepdone";tRender();window.scrollTo(0,0)}
function tAnswer(ok){
  const t=T.q.shift();
  if(!t.tries){T.first++;if(ok)T.firstOk++}
  t.tries++;
  const strict=["exam","final"].includes(TPATH[T.p].s);
  if(ok){t.need=(t.need||1)-1;if(t.need>0)T.q.splice(Math.min(T.q.length,4),0,t)}
  else{T.err++;t.need=strict?2:1;t.sel=null;t.pick=null;t.checked=null;T.q.splice(Math.min(T.q.length,3),0,t)}
  T.open=false;T.played=null;
  if(!T.q.length)tFinishStep();else tRender();
}
function tHome(v){
  const n=tNext(),done=TPATH.filter(p=>tDone(p.id)).length;
  const fs=tp.finalScore;
  let h=`<div class="card" style="min-height:0;gap:10px">
    <div class="ru" style="font-weight:700">Подготовка к проверочной</div>
    <div class="hint">Цикл для каждого блока: разбор → слова → тоны → порядок слов → перевод на слух → перевод с русского → диктант. Каждые 3 блока повторение пройденного, в конце пробная контрольная и финальная проверка. Ошибки возвращаются, пока не ответите верно.</div>
    <div class="bar" style="margin-top:0"><i style="width:${done/TPATH.length*100}%"></i></div>
    <div class="hint">Пройдено шагов: ${done} из ${TPATH.length}</div>
    ${fs?`<div class="ru" style="font-size:15px;color:${fs[0]===fs[1]?"var(--ok)":"var(--seal)"}">Финальная проверка: с первого раза ${fs[0]} из ${fs[1]}. ${fs[0]===fs[1]?"Вы готовы к проверочной.":"Пройдите её ещё раз, цель — всё с первого раза."}</div>`:""}
    ${n>=0?`<button class="btn main" id="tgo">${done?"Продолжить":"Начать"}: ${esc(TPATH[n].n)}${TPATH[n].b!=null?" · "+esc(TB[TPATH[n].b].title):""}</button>`:`<button class="btn main" id="tfin">Пройти финальную проверку ещё раз</button>`}
  </div><div class="list">`;
  TB.forEach((b,bi)=>{
    h+=`<div class="item"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div style="font-weight:700">${bi+1}. ${esc(b.title)}</div><div class="hint zh" style="font-size:14px">${esc(b.units[0].zh.slice(0,16))}${b.units[0].zh.length>16||b.units.length>1?"…":""}</div></div></div>
    <div class="dots">${TSTEPS.map(([s,nm])=>{const i=TPATH.findIndex(p=>p.id===b.id+":"+s);return `<button class="dot${tDone(b.id+":"+s)?" on":""}${i===n?" cur":""}" data-i="${i}">${nm}</button>`}).join("")}</div></div>`;
    const ri=TPATH.findIndex(p=>p.id==="rev"+bi);
    if(ri>=0)h+=`<button class="item rowbtn${tDone(TPATH[ri].id)?" ok":""}" data-i="${ri}">${tDone(TPATH[ri].id)?"✓ ":""}${esc(TPATH[ri].n)}</button>`;
  });
  ["exam","final"].forEach(id=>{const i=TPATH.findIndex(p=>p.id===id);h+=`<button class="item rowbtn${tDone(id)?" ok":""}" data-i="${i}">${tDone(id)?"✓ ":""}${esc(TPATH[i].n)}</button>`});
  h+=`</div><button class="btn" id="treset" style="margin-top:14px;width:100%">Сбросить прогресс подготовки</button>`;
  v.innerHTML=h;
  if($("#tgo"))$("#tgo").onclick=()=>tStart(n);
  if($("#tfin"))$("#tfin").onclick=()=>tStart(TPATH.length-1);
  v.querySelectorAll("[data-i]").forEach(e=>e.onclick=()=>tStart(+e.dataset.i));
  $("#treset").onclick=()=>{if(confirm("Сбросить весь прогресс подготовки?")){Object.keys(tp).forEach(k=>delete tp[k]);save();tRender()}};
}
function tTop(extra){const p=TPATH[T.p];return `<div class="tbar"><button class="chip" id="thome">← План</button><div class="hint" style="text-align:right">${p.b!=null?esc(TB[p.b].title)+"<br>":""}<b style="color:var(--ink)">${esc(p.n)}</b>${extra||""}</div></div>`}
function tLearn(v){
  const b=TB[TPATH[T.p].b];
  v.innerHTML=tTop()+`<div class="list">
    <div class="item tip"><div style="font-weight:700;margin-bottom:4px">Главное в этом блоке</div><div style="font-size:15px">${wrap(b.tip)}</div></div>
    ${b.units.map(u=>`<div class="item"><div class="zh">${wrap(u.zh)}</div><div class="py">${esc(u.py)}</div><div class="ru">${esc(u.ru)}</div>
      ${u.parts?`<div class="parts">${u.parts.map(p=>`<div><span class="zh">${wrap(p[1])}</span> <span class="hint">${esc(p[2])}</span><br>${esc(p[0])}</div>`).join("")}</div>`:""}
      <div class="row" style="margin-top:8px"><button class="say" data-t="${esc(u.zh)}">▶ Слушать</button><button class="say" data-t="${esc(u.zh)}" data-r=".5">🐢 Медленно</button></div></div>`).join("")}
    <div class="item"><div style="font-weight:700;margin-bottom:6px">Слова блока</div>${b.words.map(w=>`<div class="wl"><span class="zh">${wrap(w[0])}</span><span class="py">${esc(w[1])}</span><span>${esc(w[2])}</span></div>`).join("")}<div class="hint" style="margin-top:6px">Нажмите на иероглиф, чтобы увидеть ключ, состав и перевод.</div></div>
  </div><div class="row"><button class="btn main" id="tok">Прочитал, понял — дальше</button></div>`;
  v.querySelectorAll(".say").forEach(e=>e.onclick=()=>say(e.dataset.t,+(e.dataset.r||.8)));bindHz(v);
  $("#thome").onclick=()=>{T.view="home";tRender()};
  $("#tok").onclick=tFinishStep;
}
function tRun(v){
  const t=T.q[0],left=T.q.length;
  let body="",foot="";
  const sg=`<button class="btn no" id="tno">Ошибся</button><button class="btn ok" id="tyes">Верно</button>`;
  const show=`<button class="btn main" id="tshow">Показать ответ</button>`;
  const audio=f=>`<div class="row" style="margin-top:0"><button class="btn main" id="tp1">▶ Слушать</button><button class="btn" id="tp2">🐢 Медленно</button></div><button class="say" id="ttext">Нет звука? Показать иероглифы</button><div class="zh mid hide" id="ttx">${wrap(f.zh)}</div>`;
  if(t.k==="flash"){
    const w=t.w;
    if(t.dir==="zh"){body=`<div class="zh big">${esc(w[0])}</div>`+(T.open?`<div class="ans"><div class="py big">${esc(w[1])}</div><div class="ru big">${esc(w[2])}</div>${brkWord(w[0])}</div>`:"")}
    else{body=`<div class="ru big">${esc(w[2])}</div><div class="hint" style="text-align:center">Напишите иероглифы на бумаге</div>`+(T.open?`<div class="ans"><div class="zh big">${esc(w[0])}</div><div class="py big">${esc(w[1])}</div>${brkWord(w[0])}</div>`:"")}
    foot=T.open?sg:show;
  }else if(t.k==="tone"){
    if(!t.sel)t.sel=t.u.tn.map(()=>null);
    const ch=t.checked;
    body=`<div class="hint">Нажимайте на слог, чтобы выбрать тон: ˉ ˊ ˇ ˋ или · (лёгкий). Тоны как в учебнике: 一 и 不 меняют тон.</div><div class="ru" style="font-size:16px">${esc(t.u.ru)}</div>
    <div class="tn">${t.u.tn.map((c,i)=>{const s=t.sel[i];const cls=ch?(s===c[2]?" ok":" bad"):"";return `<button class="tc${cls}" data-i="${i}"${ch?" disabled":""}><span class="zh">${c[0]}</span><span class="tm">${s==null?"?":TONE[s]}</span><span class="tp">${ch?c[3]:c[1]}</span></button>`}).join("")}</div>
    <button class="say" data-t="${esc(t.u.zh)}">▶ Послушать</button>`;
    if(ch){const ok=t.u.tn.every((c,i)=>t.sel[i]===c[2]);body+=`<div class="ans"><div class="py">${esc(t.u.py)}</div><div class="ru" style="font-size:16px;color:${ok?"var(--ok)":"var(--seal)"}">${ok?"Все тоны верны":"Есть ошибки — этот пример вернётся"}</div></div>`;foot=`<button class="btn main" id="tnext" data-ok="${ok?1:0}">Дальше</button>`}
    else foot=`<button class="btn main" id="tcheck">Проверить</button>`;
  }else if(t.k==="tiles"){
    if(!t.pick){t.pick=[];t.pool=sh(t.t.seg.map((x,i)=>({x,i})))}
    const ch=t.checked;
    body=`<div class="hint">Соберите фразу по-китайски в правильном порядке</div><div class="ru">${esc(t.t.ru)}</div>
    <div class="tl ans-area">${t.pick.map((o,j)=>`<button class="tile" data-j="${j}"${ch?" disabled":""}>${o.x}</button>`).join("")||`<span class="hint">нажимайте на слова ниже</span>`}</div>
    <div class="tl">${t.pool.filter(o=>!t.pick.includes(o)).map(o=>`<button class="tile pool" data-i="${o.i}"${ch?" disabled":""}>${o.x}</button>`).join("")}</div>`;
    if(ch){const got=t.pick.map(o=>o.x).join("");const ok=[t.t.seg.join(""),...t.t.alt].includes(got);body+=`<div class="ans"><div class="ru" style="font-size:16px;color:${ok?"var(--ok)":"var(--seal)"}">${ok?"Верно":"Неверно. Правильно:"}</div>${ok?"":`<div class="zh mid">${wrap(t.t.seg.join(""))}</div>`}${t.t.alt.length?`<div class="hint">Также верно: ${t.t.alt.map(esc).join(", ")}</div>`:""}</div>`;foot=`<button class="btn main" id="tnext" data-ok="${ok?1:0}">Дальше</button>`}
    else foot=`<button class="btn" id="tclr">Очистить</button><button class="btn main" id="tcheck"${t.pick.length===t.t.seg.length?"":" disabled"}>Проверить</button>`;
  }else if(t.k==="hear"){
    body=`<div class="hint">Послушайте и переведите на русский (вслух или на бумаге)</div>`+audio(t.f)+(T.open?`<div class="ans"><div class="zh mid">${wrap(t.f.zh)}</div><div class="py">${esc(t.f.py)}</div><div class="ru">${esc(t.f.ru)}</div></div>`:"");
    foot=T.open?sg:show;
  }else if(t.k==="write"){
    body=`<div class="hint">Напишите по-китайски иероглифами на бумаге</div><div class="ru">${esc(t.f.ru)}</div>`+(T.open?`<div class="ans"><div class="zh mid">${wrap(t.f.zh)}</div><div class="py">${esc(t.f.py)}</div><div class="hint">Сверьте каждый иероглиф и порядок слов. Хотя бы одна ошибка — нажмите «Ошибся».</div></div>`:"");
    foot=T.open?sg:show;
  }else if(t.k==="dict"){
    body=`<div class="hint">Диктант: запишите иероглифами и поставьте тоны</div>`+audio(t.f)+(T.open?`<div class="ans"><div class="zh mid">${wrap(t.f.zh)}</div><div class="py">${esc(t.f.py)}</div><div class="ru" style="font-size:15px;color:var(--muted)">${esc(t.f.ru)}</div></div>`:"");
    foot=T.open?sg:show;
  }
  v.innerHTML=tTop(`<br>осталось: ${left}${T.err?` · ошибок: ${T.err}`:""}`)+`<div class="card"><div class="meta"><span>${esc(t.f?t.f.src:t.k==="flash"?"Слово":t.k==="tone"?"Тоны":"Порядок слов")}</span><span>${Math.max(0,T.total-left)+1} / ${T.total}</span></div><div class="q">${body}</div><div class="row">${foot}</div><div class="bar"><i style="width:${(T.total-left)/Math.max(1,T.total)*100}%"></i></div></div>`;
  $("#thome").onclick=()=>{T.view="home";try{window.speechSynthesis.cancel()}catch(e){};tRender()};
  v.querySelectorAll(".say[data-t]").forEach(e=>e.onclick=()=>say(e.dataset.t));
  bindHz(v);
  if($("#tshow"))$("#tshow").onclick=()=>{T.open=true;tRender()};
  if($("#tyes"))$("#tyes").onclick=()=>tAnswer(true);
  if($("#tno"))$("#tno").onclick=()=>tAnswer(false);
  if($("#tnext"))$("#tnext").onclick=e=>tAnswer(e.currentTarget.dataset.ok==="1");
  if(t.k==="tone"&&!t.checked){v.querySelectorAll(".tc").forEach(e=>e.onclick=()=>{const i=+e.dataset.i,s=t.sel[i];t.sel[i]=s==null?1:s===4?0:s===0?1:s+1;tRender()});$("#tcheck").onclick=()=>{t.checked=true;tRender()}}
  if(t.k==="tiles"&&!t.checked){
    v.querySelectorAll(".tile.pool").forEach(e=>e.onclick=()=>{t.pick.push(t.pool.find(o=>o.i===+e.dataset.i));tRender()});
    v.querySelectorAll(".tile[data-j]").forEach(e=>e.onclick=()=>{t.pick.splice(+e.dataset.j,1);tRender()});
    $("#tclr").onclick=()=>{t.pick=[];tRender()};
    $("#tcheck").onclick=()=>{t.checked=true;tRender()};
  }
  if($("#tp1")){
    $("#tp1").onclick=()=>say(t.f.zh,.8);$("#tp2").onclick=()=>say(t.f.zh,.5);
    $("#ttext").onclick=()=>$("#ttx").classList.toggle("hide");
    if(!T.open&&T.played!==t){T.played=t;say(t.f.zh,.8)}
  }
}
function tStepDone(v){
  const p=TPATH[T.p],n=tNext();
  const acc=T.first?`С первого раза верно: ${T.firstOk} из ${T.first}.`:"";
  let msg="Шаг пройден.";
  if(p.s==="final")msg=T.firstOk===T.first?"Всё с первого раза. Вы готовы к проверочной.":"Финальная проверка закончена. Пройдите её ещё раз, пока всё не будет верно с первого раза.";
  else if(p.s==="exam")msg="Пробная контрольная пройдена.";
  v.innerHTML=`<div class="card"><div class="done"><div class="zh big">${p.s==="final"&&T.firstOk!==T.first?"再":"好"}</div><div class="ru">${esc(msg)}</div><div class="hint">${acc}</div>
  ${n>=0?`<button class="btn main" id="tgo">Дальше: ${esc(TPATH[n].n)}${TPATH[n].b!=null?" · "+esc(TB[TPATH[n].b].title):""}</button>`:""}
  ${p.s==="final"?`<button class="btn${n<0?" main":""}" id="tagain">Пройти финальную проверку ещё раз</button>`:""}
  <button class="btn" id="th2">К плану</button></div></div>`;
  if($("#tgo"))$("#tgo").onclick=()=>tStart(n);
  if($("#tagain"))$("#tagain").onclick=()=>tStart(TPATH.length-1);
  $("#th2").onclick=()=>{T.view="home";tRender()};
}
function tRender(){
  const v=$("#view");if(st.mode!=="test")return;
  if(T.view==="home")return tHome(v);
  if(T.view==="learn")return tLearn(v);
  if(T.view==="stepdone")return tStepDone(v);
  return tRun(v);
}

const tabs=$("#tabs").querySelectorAll("button");
function setTab(m){tabs.forEach(b=>b.classList.toggle("on",b.dataset.m===m));st.mode=m}
tabs.forEach(b=>b.onclick=()=>{setTab(b.dataset.m);opts();build()});
setTab(st.mode);opts();build();
</script>
</body>
