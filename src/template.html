<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf4e7" id="metaTheme">
<title>朱 · Тренажёр иероглифов</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.7.3/hanzi-writer.min.js"></script>
<style>
/* ===== ТЕМА: светлая «рисовая бумага» (по умолчанию) ===== */
:root{
  --ink:#faf4e7;               /* фон-бумага */
  --surface:#fffdf8;           /* карточка */
  --surface-2:#fbf3e3;         /* лёгкий второй тон */
  --ink2:#fffdf8;              /* = surface (алиас) */
  --ink3:#f2e8d4;              /* вставки/инпуты */
  --line:#e7d4ba;              /* рамки */
  --paper:#2b211b;             /* основной текст */
  --paper-dim:#6e5f52;         /* вторичный текст */
  --muted:#8a7a69;             /* третичный */
  --cinnabar:#e23d2e;          /* киноварь (primary) */
  --cinnabar-2:#c1352a;        /* акцентный текст на светлом */
  --cinnabar-ink:#fbe7e2;      /* фон активных чипов */
  --gold:#9a6b06;              /* золото */
  --jade:#0e7d5d;              /* нефрит */
  --indigo:#2f5fa8;            /* индиго */
  --t1:#e23d2e; --t2:#9a6b06; --t3:#0e7d5d; --t4:#2f5fa8; --t5:#8a7a69;
  --ok:#0e7d5d; --bad:#d24a39;
  --r:16px; --rs:11px;
  --shadow:0 10px 26px rgba(150,100,40,.13);
  --seal:#e23d2e;
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* ===== ТЕМА: тёмная тушь (по желанию) ===== */
[data-theme="dark"]{
  --ink:#141110; --surface:#1c1815; --surface-2:#17120f; --ink2:#1c1815; --ink3:#251f1b;
  --line:#352c26; --paper:#ece3d4; --paper-dim:#b7ab98; --muted:#8a7f70;
  --cinnabar:#cf4530; --cinnabar-2:#e0664e; --cinnabar-ink:#3a1712;
  --gold:#c8a24a; --jade:#3fa25f; --indigo:#5f86df;
  --t1:#e6504a; --t2:#d99b17; --t3:#3fa25f; --t4:#5f86df; --t5:#948b7d;
  --ok:#3fa25f; --bad:#d15646;
  --shadow:0 12px 30px rgba(0,0,0,.5); --seal:#cf4530;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1100px 520px at 85% -12%, rgba(224,162,27,.16), transparent 62%),
    radial-gradient(900px 500px at -10% 8%, rgba(21,158,118,.08), transparent 60%),
    var(--ink);
  color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overscroll-behavior-y:none;
  transition:background .3s,color .3s;
}
.han{font-family:"Songti SC","Noto Serif SC","STSong","SimSun",serif;}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px;border-radius:6px}
a{color:var(--cinnabar-2)}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + var(--safe-b))}
.view{padding:18px 16px 8px;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Верхняя панель */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:14px 16px 12px;background:linear-gradient(var(--ink) 72%,transparent);
  padding-top:calc(12px + env(safe-area-inset-top,0px))}
.seal{width:40px;height:40px;border-radius:9px;background:var(--seal);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:23px;line-height:1;
  box-shadow:0 4px 12px rgba(226,61,46,.35);position:relative}
.seal::after{content:"";position:absolute;inset:4px;border:1.5px solid rgba(255,255,255,.5);border-radius:6px}
.seal.han{padding-bottom:1px}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.top .sub{font-size:11px;color:var(--muted);margin-top:1px;letter-spacing:.02em}
.top .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;color:var(--paper-dim);box-shadow:var(--shadow)}
.iconbtn:active{transform:scale(.94)}

/* Главная */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.hero{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--line);
  border-radius:var(--r);padding:20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,var(--cinnabar),var(--gold) 55%,var(--jade))}
.hero::after{content:"学";position:absolute;right:-16px;bottom:-34px;font-size:158px;
  color:var(--cinnabar);opacity:.06;font-family:"Songti SC",serif}
.hero h2{margin:0 0 3px;font-size:16px;font-weight:700}
.hero p{margin:0 0 15px;color:var(--paper-dim);font-size:13px}
.duebar{display:flex;gap:10px;margin-bottom:15px}
.duechip{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:var(--rs);padding:11px 8px;text-align:center}
.duechip b{display:block;font-size:23px;line-height:1.1;font-weight:800}
.duechip.new b{color:var(--cinnabar)} .duechip.rev b{color:var(--gold)} .duechip.learn b{color:var(--jade)}
.duechip span{font-size:10px;color:var(--muted);letter-spacing:.03em}
.btn{display:block;width:100%;text-align:center;background:var(--cinnabar);color:#fff;font-weight:700;
  padding:15px;border-radius:var(--rs);font-size:15px;box-shadow:0 8px 20px rgba(226,61,46,.30);letter-spacing:.01em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--paper);box-shadow:var(--shadow)}
.btn.mini{display:inline-block;width:auto;padding:10px 15px;font-size:13px}
.btn[disabled]{opacity:.5;box-shadow:none;pointer-events:none;background:var(--ink3);color:var(--muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;text-align:left;box-shadow:var(--shadow)}
.tile:active{transform:scale(.985)}
.tile .ic{font-size:21px}.tile h3{margin:9px 0 2px;font-size:14px;font-weight:700}
.tile p{margin:0;font-size:11.5px;color:var(--muted)}

/* Списки */
.rowlist{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface-2)}
.row .n{width:31px;height:31px;border-radius:8px;background:var(--ink);display:grid;place-items:center;
  font-size:12px;color:var(--paper-dim);border:1px solid var(--line);flex:none;font-weight:700}
.row .tt{flex:1;min-width:0}
.row .tt b{font-size:14px;font-weight:650;display:block}
.row .tt small{color:var(--muted);font-size:11.5px}
.row .cnt{font-size:11px;color:var(--gold);background:var(--ink);border:1px solid var(--line);border-radius:20px;padding:3px 9px;flex:none;font-weight:600}
.row .chev{color:var(--muted);font-size:16px;flex:none}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--paper-dim);margin-left:6px;font-weight:600}
.pill.hsk{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:color-mix(in srgb,var(--gold) 9%,transparent)}
.pill.k{color:var(--cinnabar-2);border-color:color-mix(in srgb,var(--cinnabar) 35%,transparent);background:var(--cinnabar-ink)}

.tabs{display:flex;gap:8px;margin:2px 0 14px}
.tab{flex:1;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;color:var(--paper-dim);text-align:center;font-weight:600;box-shadow:var(--shadow)}
.tab.on{background:var(--cinnabar-ink);border-color:color-mix(in srgb,var(--cinnabar) 40%,transparent);color:var(--cinnabar-2)}

.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;color:var(--paper);font-size:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.search::placeholder{color:var(--muted)}

/* Элемент словаря */
.witem{display:flex;align-items:center;gap:13px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.witem:active{background:var(--surface-2)}
.witem .hz{font-size:27px;line-height:1;min-width:36px;color:var(--paper)}
.witem .mid{flex:1;min-width:0}
.witem .py{font-size:13px}
.witem .tr{font-size:12.5px;color:var(--paper-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.witem .dot.seen{background:var(--indigo)} .witem .dot.due{background:var(--gold)} .witem .dot.known{background:var(--jade)}

/* Карточка слова */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 18px 22px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.card::after{content:"朱";position:absolute;top:12px;right:12px;width:26px;height:26px;background:var(--seal);
  color:#fff;border-radius:6px;display:grid;place-items:center;font-family:"Songti SC",serif;font-size:15px;
  box-shadow:0 2px 7px rgba(226,61,46,.3)}
.card .paperlines{position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  background-image:linear-gradient(color-mix(in srgb,var(--paper) 5%,transparent) 1px,transparent 1px);background-size:100% 30px;opacity:.6}
.bighz{font-size:98px;line-height:1.05;margin:6px 0 8px;letter-spacing:2px;color:var(--paper)}
.bigpy{font-size:22px;margin-bottom:8px}
.bigtr{font-size:16px;color:var(--paper);margin-bottom:2px;font-weight:600}
.bigen{font-size:13px;color:var(--muted);margin-top:4px}
.tagrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:13px}
.cardbtns{display:flex;gap:10px;justify-content:center;margin-top:17px}
.cardbtns .iconbtn{width:48px;height:48px;font-size:20px}
.cardbtns .iconbtn.primary{background:var(--cinnabar);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(226,61,46,.3)}

.meta{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.meta .mr{display:flex;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;gap:12px}
.meta .mr:last-child{border-bottom:none}
.meta .mr .k{color:var(--muted);width:120px;flex:none;font-weight:600}
.meta .mr .v{flex:1}
.strokeline{font-size:13px;line-height:1.7}
.strokeline .num{color:var(--cinnabar-2);font-weight:700;margin-right:6px}

/* Учёба */
.qwrap{min-height:60vh;display:flex;flex-direction:column}
.progress{height:5px;background:var(--ink3);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--cinnabar),var(--gold));width:0;transition:width .3s}
.qcard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 18px;text-align:center;box-shadow:var(--shadow);min-height:46vh;position:relative;overflow:hidden}
.qcard::after{content:"朱";position:absolute;top:12px;right:12px;width:24px;height:24px;background:var(--seal);
  color:#fff;border-radius:6px;display:grid;place-items:center;font-family:"Songti SC",serif;font-size:14px;opacity:.9}
.qhz{font-size:106px;line-height:1;letter-spacing:2px;color:var(--paper)}
.qsub{font-size:15px;color:var(--paper-dim);margin-top:18px}
.qprompt{font-size:15px;color:var(--muted);margin-bottom:16px;font-weight:600}
.qbig-tr{font-size:26px;font-weight:700;line-height:1.3}
.reveal{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;width:100%}
.reveal .py{font-size:20px} .reveal .tr{font-size:17px;margin-top:4px;font-weight:600}
.reveal .en{font-size:13px;color:var(--muted);margin-top:6px}

.choices{display:grid;gap:10px;margin-top:6px}
.choice{padding:15px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:17px;text-align:center;box-shadow:var(--shadow)}
.choice:active{transform:scale(.99)}
.choice.correct{background:color-mix(in srgb,var(--jade) 16%,var(--surface));border-color:var(--jade);color:var(--jade)}
.choice.wrong{background:color-mix(in srgb,var(--bad) 13%,var(--surface));border-color:var(--bad);color:var(--bad)}

.tinput{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;
  color:var(--paper);font-size:18px;text-align:center;letter-spacing:1px;box-shadow:var(--shadow)}
.hintbtn{background:none;color:var(--muted);font-size:12px;margin-top:10px;text-decoration:underline}

.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grade{padding:12px 6px;border-radius:11px;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.grade small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.grade b{font-size:14px;font-weight:700}
.grade.g1{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}.grade.g1 b{color:var(--bad)}
.grade.g2{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}.grade.g2 b{color:var(--gold)}
.grade.g3{border-color:color-mix(in srgb,var(--jade) 45%,transparent)}.grade.g3 b{color:var(--jade)}
.grade.g4{border-color:color-mix(in srgb,var(--indigo) 45%,transparent)}.grade.g4 b{color:var(--indigo)}
.grade:active{transform:translateY(1px)}
.showbtn{margin-top:14px}

.actionrow{display:flex;gap:10px;margin-top:14px}
.actionrow .btn{margin:0}

/* Прописи */
#writer{width:260px;height:260px;margin:6px auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);touch-action:none}
.gridbg{position:relative}
.drawhint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}

/* Нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--ink) 90%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;max-width:560px;margin:0 auto;padding-bottom:var(--safe-b)}
.nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:10px;font-weight:600}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--cinnabar)}

/* Прочее */
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.empty .big{font-size:48px;margin-bottom:10px;color:var(--jade)}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);
  background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:11px 17px;border-radius:11px;
  font-size:13px;z-index:50;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;font-weight:600}
.toast.on{opacity:1}
.back{font-size:14px;color:var(--paper-dim);display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-weight:600}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);gap:12px}
.setrow:last-child{border-bottom:none}
.setrow .lab b{font-size:14px}.setrow .lab small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:34px;height:34px;border-radius:9px;background:var(--ink3);border:1px solid var(--line);font-size:18px}
.stepper b{min-width:26px;text-align:center;font-size:16px;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 12px;font-size:12px;color:var(--paper-dim);background:var(--surface);font-weight:600}
.seg button.on{background:var(--cinnabar-ink);color:var(--cinnabar-2)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="seal han">朱</div>
    <div><h1 id="topTitle">Тренажёр иероглифов</h1><div class="sub" id="topSub">Кондрашевский · HSK 1–6</div></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnAudioTest" title="Проверить озвучку">🔊</button>
  </div>
  <div id="screen"></div>
</div>
<nav class="nav" id="nav">
  <button data-nav="home" class="on"><span class="ic">◈</span>Главная</button>
  <button data-nav="browse"><span class="ic">☰</span>Словарь</button>
  <button data-nav="study"><span class="ic">✎</span>Учить</button>
  <button data-nav="draw"><span class="ic">笔</span>Прописи</button>
  <button data-nav="settings"><span class="ic">⚙</span>Ещё</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/*==================================================================
  ДАННЫЕ
==================================================================*/
const DB_RAW = /*__DATA__*/;
const WORDS = DB_RAW.words;          // [{s,p,ru,en,rad,hsk,pos,cl,f,k,alt}]
const CHARS = DB_RAW.chars;          // { '好':[6,'撇点 撇 横 ...'] }
WORDS.forEach((w,i)=>{ w.id=i; });   // stable id = index
const byChar = {};
WORDS.forEach(w=>{ if(!byChar[w.s]) byChar[w.s]=w; });

/*==================================================================
  ХРАНИЛИЩЕ (IndexedDB + резерв в памяти)
  В превью claude.ai хранилище может быть недоступно — тогда работаем
  в памяти (прогресс не переживёт перезагрузку). На GitHub Pages / после
  установки PWA прогресс сохраняется полностью.
==================================================================*/
const Store = (()=>{
  let mem = { cards:{}, settings:{}, meta:{} };
  let idb = null, ok = false;
  function open(){
    return new Promise(res=>{
      try{
        const r = indexedDB.open('hanzi-trainer', 1);
        r.onupgradeneeded = e=>{ e.target.result.createObjectStore('kv'); };
        r.onsuccess = e=>{ idb=e.target.result; ok=true; res(true); };
        r.onerror = ()=>{ res(false); };
        setTimeout(()=>{ if(!ok) res(false); }, 800);
      }catch(e){ res(false); }
    });
  }
  function get(k){
    if(!ok) return Promise.resolve(mem[k]);
    return new Promise(res=>{
      const t=idb.transaction('kv','readonly').objectStore('kv').get(k);
      t.onsuccess=()=>res(t.result); t.onerror=()=>res(mem[k]);
    });
  }
  function set(k,v){
    mem[k]=v;
    if(!ok) return Promise.resolve();
    return new Promise(res=>{
      const t=idb.transaction('kv','readwrite').objectStore('kv').put(v,k);
      t.onsuccess=()=>res(); t.onerror=()=>res();
    });
  }
  return {open,get,set,persistent:()=>ok};
})();

/*==================================================================
  FSRS-5  — интервальное повторение (веса по умолчанию)
==================================================================*/
const FSRS = (()=>{
  const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,
           0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
  const DECAY=-0.5, F=Math.pow(0.9,1/DECAY)-1;          // ≈0.2345
  const clampD=d=>Math.min(Math.max(d,1),10);
  const clampS=s=>Math.max(s,0.01);
  const D0=g=>clampD(W[4]-Math.exp(W[5]*(g-1))+1);
  const S0=g=>clampS(W[g-1]);
  const retr=(t,S)=>Math.pow(1+F*t/S,DECAY);
  function nextD(D,g){ let d=D-W[6]*(g-3); d=D+(d-D)*(10-D)/9; return clampD(W[7]*D0(4)+(1-W[7])*d); }
  function sSucc(D,S,r,g){ const h=g===2?W[15]:1, e=g===4?W[16]:1;
    return clampS(S*(1+Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-r))-1)*h*e)); }
  function sFail(D,S,r){ return clampS(Math.min(W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-r)),S)); }
  // days interval for desired retention
  function interval(S,req){ return Math.max(1,Math.round(S/F*(Math.pow(req,1/DECAY)-1))); }
  const DAY=864e5;
  // card: {S,D,due,last,reps,lapses,state}  state: 0 new, 1 review
  function review(card, g, req){
    const now=Date.now();
    let c = Object.assign({}, card);
    if(!c.state){ // first exposure
      c.S=S0(g); c.D=D0(g); c.reps=1; c.lapses=g===1?1:0; c.state=1;
    }else{
      const t=Math.max(0,(now-(c.last||now))/DAY);
      const r=retr(t,c.S);
      if(g===1){ c.S=sFail(c.D,c.S,r); c.lapses=(c.lapses||0)+1; }
      else{ c.S=sSucc(c.D,c.S,r,g); }
      c.D=nextD(c.D,g); c.reps=(c.reps||0)+1;
    }
    c.last=now;
    if(g===1){ c.due=now+6*6e4; }                 // «Снова» → через ~6 мин, в этой же сессии
    else{ c.due=now+interval(c.S,req)*DAY; }
    return c;
  }
  // предпросмотр интервалов для кнопок
  function preview(card, req){
    const out={};
    [1,2,3,4].forEach(g=>{
      const c=review(card,g,req);
      const ms=c.due-Date.now();
      out[g]= g===1 ? '6 мин' : humanIv(ms);
    });
    return out;
  }
  function humanIv(ms){
    const d=ms/864e5;
    if(d<1) return Math.max(1,Math.round(ms/6e4))+' мин';
    if(d<30) return Math.round(d)+' дн';
    if(d<365) return Math.round(d/30)+' мес';
    return (d/365).toFixed(1)+' г';
  }
  return {review,preview,interval,DAY};
})();

function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function keyOf(id){ return WORDS[id].s; }
function cardOf(id){ return State.cards[keyOf(id)]; }
function isDue(id){ const c=cardOf(id); return c && c.state && c.due<=Date.now(); }
function isNew(id){ return !cardOf(id) || !cardOf(id).state; }
function statusOf(id){
  const c=cardOf(id);
  if(!c||!c.state) return 'new';
  if(c.due<=Date.now()) return 'due';
  if(c.S>=60) return 'known';
  return 'seen';
}
// Собрать очередь на изучение из пула id
function buildQueue(pool){
  const due=[], fresh=[];
  pool.forEach(id=>{
    if(isDue(id)) due.push(id);
    else if(isNew(id)) fresh.push(id);
  });
  due.sort((a,b)=>cardOf(a).due-cardOf(b).due);
  // новые: сначала уроки Кондрашевского по порядку, затем HSK по уровню и частотности
  const rank=id=>{const w=WORDS[id]; return (w.k? w.k[0] : 999)*1e6 + (w.hsk||9)*1e5 + (w.f||99999);};
  fresh.sort((a,b)=>rank(a)-rank(b));
  const room=Math.max(0,State.settings.newPerDay-State.meta.newToday);
  let q = due.concat(fresh.slice(0, pool._forceNew? fresh.length : room));
  const cap=State.settings.sessionCap;
  if(cap>0 && !pool._forceNew) q=q.slice(0,cap);
  return q;
}

const TONE_MAP={'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
  'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
  'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],'ǖ':['ü',1],'ǘ':['ü',2],'ǚ':['ü',3],'ǜ':['ü',4],
  'ü':['ü',5],'ń':['n',2],'ň':['n',3],'ǹ':['n',4]};
function syllTone(s){ for(const ch of s){ if(TONE_MAP[ch]) return TONE_MAP[ch][1]; } return 5; }
function pinyinHTML(py){
  return py.split(/(\s+)/).map(tok=>{
    if(/^\s+$/.test(tok)) return tok;
    const t=syllTone(tok);
    return '<span style="color:var(--t'+t+')">'+esc(tok)+'</span>';
  }).join('');
}
function toneless(s){ let o=''; for(const ch of s.toLowerCase()){ o+= TONE_MAP[ch]?TONE_MAP[ch][0]:ch; } return o.replace(/ü/g,'v').replace(/[^a-z0-9]/g,''); }

/*==================================================================
  ОЗВУЧКА (Web Speech API)
==================================================================*/
const Speech=(()=>{
  let voices=[], chosen=null, prefName=null;
  let pack=null;   // Set имён mp3-файлов локального аудио-пака (если выложен)
  fetch('./audio/manifest.json').then(r=>r.ok?r.json():null)
    .then(j=>{ if(j&&Array.isArray(j)&&j.length) pack=new Set(j); })
    .catch(()=>{});
  function refresh(){ voices=speechSynthesis.getVoices()||[];
    const zh=voices.filter(v=>/zh|cmn|chinese/i.test(v.lang+v.name));
    chosen = (prefName&&zh.find(v=>v.name===prefName)) || zh.find(v=>/CN|Hans|普通话|Ting|Tingting|Mandarin/i.test(v.name+v.lang)) || zh[0] || null;
  }
  if('speechSynthesis' in window){ refresh(); speechSynthesis.onvoiceschanged=refresh; }
  function tts(text){
    if(!('speechSynthesis' in window)) { toast('Озвучка недоступна в этом браузере'); return; }
    if(!chosen) refresh();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; if(chosen)u.voice=chosen; u.rate=.82;
    speechSynthesis.speak(u);
  }
  function say(text){
    if(pack){
      const fn=text+'.mp3';
      if(pack.has(fn)){
        try{ const a=new Audio('./audio/'+encodeURIComponent(fn)); a.play().catch(()=>tts(text)); return; }catch(e){}
      }
    }
    tts(text);
  }
  function setPref(name){ prefName=name||null; refresh(); }
  function list(){ refresh(); return voices.filter(v=>/zh|cmn|chinese/i.test(v.lang+v.name)); }
  function source(){ return pack ? ('аудио-пак ('+pack.size+' файлов)') : (chosen?chosen.name:'системный синтез'); }
  return {say,has:()=>('speechSynthesis' in window)||!!pack,voice:()=>chosen,setPref,list,source,hasPack:()=>!!pack};
})();

function counts(pool){
  let n=0,d=0;
  pool.forEach(id=>{ if(isDue(id))d++; else if(isNew(id))n++; });
  const room=Math.max(0,State.settings.newPerDay-State.meta.newToday);
  return {due:d,new:Math.min(n,room),newTotal:n};
}
function allIds(){ return WORDS.map(w=>w.id); }

const RUM=['янв.','февр.','марта','апр.','мая','июня','июля','авг.','сент.','окт.','нояб.','дек.'];
function fmtDate(s){ const p=(s||'').split('-').map(Number); return p.length===3? p[2]+' '+RUM[p[1]-1] : (s||''); }
function goalDate(){ const p=((State.settings.goal&&State.settings.goal.date)||'').split('-').map(Number); return p.length===3? new Date(p[0],p[1]-1,p[2]) : null; }
function goalInfo(){
  const g=State.settings.goal; if(!g||!g.on) return null;
  const L=g.lesson||20;
  const ids=WORDS.filter(w=>w.k&&w.k.some(l=>l<=L)).map(w=>w.id);
  const total=ids.length;
  const learned=ids.filter(id=>{const c=cardOf(id);return c&&c.state;}).length;
  const mature=ids.filter(id=>{const c=cardOf(id);return c&&c.S>=60;}).length;
  const remaining=Math.max(0,total-learned);
  const gd=goalDate(); let daysLeft=null;
  if(gd){ const t=new Date(); const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate()); daysLeft=Math.round((gd-t0)/864e5); }
  let phase='learn';
  if(remaining===0) phase='done';
  else if(daysLeft!=null && daysLeft<=0) phase='over';
  else if(daysLeft!=null && daysLeft<=10) phase='consolidate';
  const introDays=(daysLeft!=null)?Math.max(1,daysLeft-10):null;
  const perDay=(introDays!=null)?Math.ceil(remaining/introDays):null;
  return {L,ids,total,learned,mature,remaining,daysLeft,phase,perDay,date:g.date};
}

let SESSION=null;
function startSession(queue, mode, title){
  if(!queue.length){ toast('Нет слов к показу — всё повторено'); go('home'); return; }
  SESSION={queue:queue.slice(), mode, title, total:queue.length, done:0, again:[], fails:{}, introShown:{}, current:null};
  go('session');
}
function nextItem(){
  if(SESSION.queue.length) return SESSION.queue.shift();
  if(SESSION.again.length) return SESSION.again.shift();
  return null;
}
function viewSession(s){
  if(!SESSION){ go('home'); return; }
  let id = SESSION.current!=null ? SESSION.current : nextItem();
  if(id==null){ return sessionDone(s); }
  SESSION.current=id; SESSION.introShown=SESSION.introShown||{};
  const w=WORDS[id];
  let mode=SESSION.mode; if(mode==='mix') mode=['recog','choice','produce','pinyin','listen','tones','recall'][Math.random()*7|0];
  if((mode==='listen'||mode==='tones') && !Speech.has()) mode='recog';

  const v=el('div','view qwrap');
  const hdr=el('div',''); hdr.style.cssText='display:flex;align-items:center;justify-content:space-between';
  const back=el('button','back','✕ Завершить'); back.onclick=()=>{ SESSION=null; document.onkeydown=null; go('home'); };
  hdr.appendChild(back);
  if(SESSION.last){ const ub=el('button','back','↩ Отменить'); ub.title='Backspace'; ub.onclick=undoLast; hdr.appendChild(ub); }
  v.appendChild(hdr);
  const prog=el('div','progress',`<i style="width:${(SESSION.done/SESSION.total*100)|0}%"></i>`); v.appendChild(prog);
  const stage=el('div',''); v.appendChild(stage);
  s.appendChild(v);
  document.onkeydown=(e)=>{
    if(!SESSION) return;
    if(e.target && e.target.tagName==='INPUT') return;
    if(e.key===' '||e.key==='Enter'){
      const b=[...document.querySelectorAll('button')].find(x=>/Показать|Проверить/.test(x.textContent));
      if(b){ e.preventDefault(); b.click(); }
    }else if(['1','2','3','4'].includes(e.key)){
      const g=document.querySelectorAll('.grade')[+e.key-1]; if(g){ e.preventDefault(); g.click(); }
    }else if(e.key==='Backspace'){ if(SESSION.last){ e.preventDefault(); undoLast(); } }
  };
  if(isNew(id) && !SESSION.introShown[id]){ qIntro(stage,w); return; }
  ({recog:qRecog,choice:qChoice,produce:qProduce,pinyin:qPinyin,listen:qListen,tones:qTones,dictate:qDictate,recall:qRecall,typehz:qTypeHz}[mode]||qRecog)(stage,w);
}

function afterGrade(g){
  const id=SESSION.current, wasNew=isNew(id);
  SESSION.last={id, wasNew, g,
    prev: cardOf(id)?JSON.parse(JSON.stringify(cardOf(id))):null,
    hadFail: !!(SESSION.fails&&SESSION.fails[id])};
  const prev=cardOf(id)||{};
  const nc=FSRS.review(prev,g,State.settings.req);
  State.cards[keyOf(id)]=nc;
  if(wasNew){ State.meta.newToday++; }
  const d=todayStr(); State.meta.rev=State.meta.rev||{}; State.meta.rev[d]=(State.meta.rev[d]||0)+1;
  save('meta');
  if(g===1){ SESSION.again.push(id); SESSION.fails=SESSION.fails||{}; SESSION.fails[id]=1; }
  SESSION.done++;
  SESSION.current=null;
  save('cards');
  render();
}
function undoLast(){
  const L=SESSION&&SESSION.last; if(!L) return;
  const key=keyOf(L.id);
  if(L.prev) State.cards[key]=L.prev; else delete State.cards[key];
  if(L.wasNew) State.meta.newToday=Math.max(0,(State.meta.newToday||0)-1);
  const d=todayStr(); if(State.meta.rev&&State.meta.rev[d]>0) State.meta.rev[d]--;
  if(L.g===1){ const ai=SESSION.again.lastIndexOf(L.id); if(ai>-1) SESSION.again.splice(ai,1);
    if(!L.hadFail && SESSION.fails) delete SESSION.fails[L.id]; }
  SESSION.done=Math.max(0,SESSION.done-1);
  SESSION.current=L.id; SESSION.last=null;
  save('cards'); save('meta'); render();
}

  const prev=cardOf(SESSION.current)||{};

    const b=el('button','grade '+cls,`<b>${lab}</b><small>${pv[g]}</small>`);
    b.onclick=()=>afterGrade(g); bar.appendChild(b);
  });
  container.appendChild(bar);
}

function qTones(stage,w){
  const toks=w.p.trim().split(/\s+/);
  const chars=[...w.s].filter(c=>c>='\u4e00'&&c<='\u9fff');
  if(chars.length>1 && toks.length!==chars.length){ return qRecog(stage,w); }
  const c=el('div','qcard'); c.style.minHeight='22vh';
  c.innerHTML=`<div class="qhz han">${esc(w.s)}</div>
    <button class="iconbtn primary" id="tPlay" style="margin-top:14px">🔊</button>
    <div class="qsub">какой тон у каждого слога?</div>`;
  stage.appendChild(c);
  setTimeout(()=>Speech.say(w.s),150);
  const answers=new Array(toks.length).fill(null);
  const TN=['1 ˉ','2 ˊ','3 ˇ','4 ˋ','·'];
  const wrap=el('div',''); wrap.style.marginTop='14px';
  toks.forEach((tk,i)=>{
    const row=el('div','setrow');
    row.innerHTML=`<div class="lab"><b class="han" style="font-size:20px">${esc(chars[i]||'')}</b> <span style="color:var(--muted)">${esc(toneless(tk)||tk)}</span></div>`;
    const seg=el('div','seg');
    [1,2,3,4,5].forEach((t,ti)=>{ const b=el('button','',TN[ti]); b.onclick=()=>{ answers[i]=t; [...seg.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; seg.appendChild(b); });
    row.appendChild(seg); wrap.appendChild(row);
  });
  const box=el('div','meta'); box.appendChild(wrap); stage.appendChild(box);
  const chk=el('button','btn','Проверить'); chk.style.marginTop='14px'; stage.appendChild(chk);
  $('#tPlay').onclick=()=>Speech.say(w.s);
  chk.onclick=()=>{
    if(answers.includes(null)){ toast('Отметь тон каждого слога'); return; }
    const correct=toks.map(syllTone);
    const ok=answers.every((a,i)=>a===correct[i]);
    c.innerHTML=`<div class="qhz han" style="font-size:60px">${esc(w.s)}</div>
      <div class="reveal"><div class="py">${pinyinHTML(w.p)}</div>
      <div class="en" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✓ верно':'правильно: '+correct.map(t=>t===5?'·':t).join(' ')}</div></div>`;
    box.remove(); chk.remove(); Speech.has()&&Speech.say(w.s); gradeBar(stage);
  };
}

  act.appendChild(nb); v.appendChild(act); }
  if(typeof HanziWriter==='undefined') v.appendChild(el('p','note','⚠︎ Библиотека прописей не загрузилась (нет сети). Онлайн/после публикации всё работает.'));
  s.appendChild(v);

  $('#dSay').onclick=()=>Speech.say(w.s);

function mountWriter(){
  const host=$('#writer'); if(!host) return; host.innerHTML='';
  const ch=State._drawChars[State._drawIdx]; const hint=$('#drawHint');
  if(typeof HanziWriter==='undefined'){ host.innerHTML='<div style="padding:40px;color:var(--muted)">нет библиотеки</div>'; return; }
  try{
    hwInstance=HanziWriter.create('writer', ch, {
      width:260,height:260,padding:10,showCharacter:false,showOutline:true,
      strokeColor:hwColors().stroke,outlineColor:hwColors().outline,drawingColor:hwColors().draw,highlightColor:hwColors().hl,
      strokeAnimationSpeed:1.1,delayBetweenStrokes:120,
      charDataLoader:(c,onC)=>{ // сперва офлайн-пакет, потом CDN
        if(window.HZDATA && window.HZDATA[c]){ onC(window.HZDATA[c]); return; }
        fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+c+'.json')
          .then(r=>r.json()).then(d=>{ if(window.HZDATA) window.HZDATA[c]=d; onC(d); })
          .catch(()=>{ hint.textContent='нет данных для '+c+' (нужна сеть)'; });
      }
    });
    hint.textContent='Пиши иероглиф пальцем';
    hwInstance.quiz({ showHintAfterMisses:3,
      onMistake:st=>{ hint.textContent='Черта '+(st.strokeNum+1)+': попробуй ещё раз'; },
      onCorrectStroke:st=>{ hint.textContent = st.strokesRemaining>0 ? ('✓ осталось черт: '+st.strokesRemaining) : '✓'; },
      onComplete:sum=>{ hint.innerHTML='<span style="color:var(--ok)">Готово! ошибок: '+sum.totalMistakes+'</span>';
        Speech.has()&&Speech.say(ch); }
    });
    $('#dAnim').onclick=()=>{ hwInstance.animateCharacter(); };
    $('#dHint').onclick=()=>{ hwInstance.animateCharacter(); hint.textContent='Смотри анимацию, затем повтори'; };
    $('#dRedo').onclick=()=>mountWriter();
  }catch(e){ host.innerHTML='<div style="padding:40px;color:var(--muted)">ошибка: '+esc(e.message)+'</div>'; }
}

function streakDays(){
  const rev=State.meta.rev||{}; const d=new Date();
  const today=dstr(d);
  if(!(rev[today]>0)) d.setDate(d.getDate()-1);
  let s=0; for(;;){ const k=dstr(d); if(rev[k]>0){ s++; d.setDate(d.getDate()-1);} else break; }
  return s;
}

  const rev=State.meta.rev||{};

  const mature=WORDS.filter(w=>{const c=cardOf(w.id);return c&&c.S>=60;}).length;
  let dueN=0; WORDS.forEach(w=>{if(isDue(w.id))dueN++;});
  const totalRev=Object.values(rev).reduce((a,b)=>a+b,0);

    <div class="duechip rev"><b>${mature}</b><span>закреплено</span></div>`;
  v.appendChild(duebar);

  v.appendChild(chart);

    box.appendChild(row); };
  [1,2,3,4,5,6].forEach(l=>prog('HSK '+l, WORDS.filter(w=>w.hsk===l).map(w=>w.id)));
  prog('Кондрашевский', WORDS.filter(w=>w.k&&w.k.length).map(w=>w.id));
  v.appendChild(box);

  // трудные слова (3+ провала)
  const tough=WORDS.filter(w=>{const c=cardOf(w.id);return c&&(c.lapses||0)>=3;})

    tb.style.marginTop='12px';
    tb.onclick=()=>startSession(tough.map(w=>w.id),'mix','Трудные слова');
    v.appendChild(tb);
  }
  s.appendChild(v);

  v.appendChild(el('h2','',`Настройки`)).style.cssText='margin:2px 0 8px;font-size:20px';
  const box=el('div','meta');
  // новых в день
  const sr1=el('div','setrow');
  sr1.innerHTML=`<div class="lab"><b>Новых слов в день</b><small>Сегодня уже: ${State.meta.newToday}</small></div>`;
  const st=el('div','stepper');
  const dec=el('button','','−'),val=el('b','',State.settings.newPerDay),inc=el('button','','+');
  dec.onclick=()=>{State.settings.newPerDay=Math.max(0,State.settings.newPerDay-2);val.textContent=State.settings.newPerDay;save('settings');};
  inc.onclick=()=>{State.settings.newPerDay=Math.min(60,State.settings.newPerDay+2);val.textContent=State.settings.newPerDay;save('settings');};
  st.appendChild(dec);st.appendChild(val);st.appendChild(inc); sr1.appendChild(st); box.appendChild(sr1);
  // лимит карточек за сессию
  const sr0=el('div','setrow');
  sr0.innerHTML=`<div class="lab"><b>Карточек за сессию</b><small>0 — без лимита (уроки не ограничиваются)</small></div>`;
  const st0=el('div','stepper');
  const d0=el('button','','−'), v0=el('b','',State.settings.sessionCap||'∞'), i0=el('button','','+');
  const upd0=()=>{ v0.textContent=State.settings.sessionCap||'∞'; save('settings'); };
  d0.onclick=()=>{ State.settings.sessionCap=Math.max(0,(State.settings.sessionCap||0)-5); upd0(); };
  i0.onclick=()=>{ State.settings.sessionCap=Math.min(100,(State.settings.sessionCap||0)+5); upd0(); };
  st0.appendChild(d0); st0.appendChild(v0); st0.appendChild(i0); sr0.appendChild(st0); box.appendChild(sr0);
  // целевое удержание
  const sr2=el('div','setrow');
  sr2.innerHTML=`<div class="lab"><b>Целевое удержание</b><small>Выше — чаще повторения</small></div>`;
  const seg=el('div','seg');
  [[.85,'85%'],[.90,'90%'],[.95,'95%']].forEach(([r,l])=>{ const b=el('button',State.settings.req===r?'on':'',l);
    b.onclick=()=>{State.settings.req=r;save('settings');[...seg.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}; seg.appendChild(b); });
  sr2.appendChild(seg); box.appendChild(sr2);
  v.appendChild(box);

  // цель
  const peG=el('p','eyebrow','Цель к началу пар'); peG.style.margin='20px 0 0'; v.appendChild(peG);
  const boxG=el('div','meta'); boxG.style.marginTop='16px';
  const g=State.settings.goal||(State.settings.goal={on:true,date:'2026-09-18',lesson:20});
  const gr1=el('div','setrow'); gr1.innerHTML=`<div class="lab"><b>Показывать цель</b><small>Прогресс-бар на главной</small></div>`;
  const gSeg=el('div','seg'); [['Вкл',true],['Выкл',false]].forEach(([l,val])=>{const b=el('button',g.on===val?'on':'',l); b.onclick=()=>{g.on=val;save('settings');[...gSeg.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}; gSeg.appendChild(b);});
  gr1.appendChild(gSeg); boxG.appendChild(gr1);
  const gr2=el('div','setrow'); gr2.innerHTML=`<div class="lab"><b>Начало пар</b><small>Дата дедлайна</small></div>`;
  const di=el('input'); di.type='date'; di.value=g.date||'2026-09-18'; di.style.cssText='background:var(--ink3);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:8px;font-size:13px';
  di.onchange=()=>{ g.date=di.value; save('settings'); }; gr2.appendChild(di); boxG.appendChild(gr2);
  const gr3=el('div','setrow'); gr3.innerHTML=`<div class="lab"><b>До какого урока</b><small>Кондрашевский, том 1</small></div>`;
  const gst=el('div','stepper'); const gdc=el('button','','−'),gvv=el('b','',g.lesson||20),gic=el('button','','+');
  const updG=()=>{gvv.textContent=g.lesson;save('settings');};
  gdc.onclick=()=>{g.lesson=Math.max(5,(g.lesson||20)-1);updG();};
  gic.onclick=()=>{g.lesson=Math.min(30,(g.lesson||20)+1);updG();};
  gst.appendChild(gdc);gst.appendChild(gvv);gst.appendChild(gic); gr3.appendChild(gst); boxG.appendChild(gr3);
  v.appendChild(boxG);

  // прогресс
  const pe=el('p','eyebrow','Прогресс'); pe.style.margin='20px 0 0'; v.appendChild(pe);
  const box2=el('div','meta'); box2.style.marginTop='16px';
  const ex=el('div','setrow'); ex.innerHTML=`<div class="lab"><b>Сохранить прогресс</b><small>Файл .json — перенести на другое устройство</small></div>`;
  const eb=el('button','btn mini','Экспорт'); eb.onclick=exportProgress; ex.appendChild(eb); box2.appendChild(ex);
  const im=el('div','setrow'); im.innerHTML=`<div class="lab"><b>Загрузить прогресс</b><small>Из ранее сохранённого файла</small></div>`;
  const ib=el('button','btn mini ghost','Импорт'); ib.onclick=importProgress; im.appendChild(ib); box2.appendChild(im);
  v.appendChild(box2);

  // озвучка и карточки
  const pe2=el('p','eyebrow','Оформление и озвучка'); pe2.style.margin='20px 0 0'; v.appendChild(pe2);
  const box3=el('div','meta'); box3.style.marginTop='16px';
  const th=el('div','setrow'); th.innerHTML=`<div class="lab"><b>Тема</b><small>Бумага — светлая, тушь — тёмная</small></div>`;
  const thSeg=el('div','seg'); [['Бумага','light'],['Тушь','dark']].forEach(([l,val])=>{ const b=el('button',State.settings.theme===val?'on':'',l);
    b.onclick=()=>{State.settings.theme=val;applyTheme();save('settings');[...thSeg.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}; thSeg.appendChild(b); });
  th.appendChild(thSeg); box3.appendChild(th);
  const ap=el('div','setrow'); ap.innerHTML=`<div class="lab"><b>Автопроизношение</b><small>Озвучивать при открытии карточки</small></div>`;
  const apSeg=el('div','seg'); [['Выкл',false],['Вкл',true]].forEach(([l,val])=>{ const b=el('button',State.settings.autoplay===val?'on':'',l);
    b.onclick=()=>{State.settings.autoplay=val;save('settings');[...apSeg.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}; apSeg.appendChild(b); });
  ap.appendChild(apSeg); box3.appendChild(ap);
  const voices=Speech.has()?Speech.list():[];
  const vr=el('div','setrow'); vr.innerHTML=`<div class="lab"><b>Голос (китайский)</b><small>${voices.length?'Голос устройства':'Голоса zh не найдены'}</small></div>`;
  if(voices.length){
    const sel=el('select'); sel.style.cssText='background:var(--ink3);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:8px;max-width:175px;font-size:12px';
    const a0=el('option'); a0.value=''; a0.textContent='Авто'; sel.appendChild(a0);
    voices.forEach(vo=>{ const o=el('option'); o.value=vo.name; o.textContent=vo.name+' ('+vo.lang+')'; if(State.settings.voiceName===vo.name)o.selected=true; sel.appendChild(o); });
    sel.onchange=()=>{ State.settings.voiceName=sel.value||null; Speech.setPref(State.settings.voiceName); save('settings'); Speech.say('你好'); };
    vr.appendChild(sel);
  }
  box3.appendChild(vr); v.appendChild(box3);

  // сброс прогресса
  const box4=el('div','meta'); box4.style.marginTop='16px';
  const rs=el('div','setrow'); rs.innerHTML=`<div class="lab"><b>Сбросить прогресс</b><small>Удалить все повторения и статистику</small></div>`;
  let armed=false; const rb=el('button','btn mini ghost','Сброс');
  rb.onclick=async()=>{ if(!armed){ armed=true; rb.textContent='Точно? Ещё раз'; rb.style.color='var(--bad)'; setTimeout(()=>{armed=false;rb.textContent='Сброс';rb.style.color='';},4000); return; }
    State.cards={}; State.meta={day:todayStr(),newToday:0,rev:{}}; await save(); toast('Прогресс сброшен'); go('home'); };
  rs.appendChild(rb); box4.appendChild(rs); v.appendChild(box4);

  // о приложении
  v.appendChild(el('p','note',`Слов в базе: ${WORDS.length} · иероглифов: ${Object.keys(CHARS).length}.<br>
    Хранилище: ${Store.persistent()?'постоянное (IndexedDB)':'в памяти (превью)'} · Озвучка: ${Speech.source()}.<br>
    Данные слов: Кондрашевский, том 1 (рус.) + HSK 3.0 (англ., перевод на рус. — в процессе). Порядок черт: стандарт 笔顺.`));
  s.appendChild(v);
}
function exportProgress(){
  State.meta.lastExport=Date.now(); save('meta');
  const data={v:1,exported:new Date().toISOString(),cards:State.cards,settings:State.settings,meta:State.meta};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=el('a'); a.href=URL.createObjectURL(blob); a.download='hanzi-progress-'+todayStr()+'.json'; a.click();
  toast('Файл прогресса сохранён');
}
function importProgress(){
  const inp=el('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=async()=>{ try{ const d=JSON.parse(rd.result);
      if(d.cards) State.cards=d.cards; if(d.settings)Object.assign(State.settings,d.settings); if(d.meta)State.meta=d.meta;
      await save(); applyTheme(); Speech.setPref(State.settings.voiceName); toast('Прогресс загружен'); go('home');
    }catch(err){ toast('Не удалось прочитать файл'); } };
    rd.readAsText(f); };
  inp.click();
}

(async function(){
  await loadState();
  applyTheme();
  Speech.setPref(State.settings.voiceName);
