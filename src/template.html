<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf4e7">
<title>朱 · Тренажёр иероглифов</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.7.3/hanzi-writer.min.js"></script>
<style>
/* ===== Оформление: «рисовая бумага и киноварь» (одна светлая тема) ===== */
:root{
  --ink:#faf4e7;               /* фон-бумага */
  --surface:#fffdf8;           /* карточка */
  --surface-2:#fbf3e3;         /* второй тон */
  --ink3:#f2e8d4;              /* вставки/инпуты */
  --line:#e7d4ba;              /* рамки */
  --paper:#2b211b;             /* основной текст */
  --paper-dim:#6e5f52;         /* вторичный текст */
  --muted:#7f6f5f;             /* третичный */
  --cinnabar:#e23d2e;          /* киноварь (главный цвет) */
  --cinnabar-2:#c1352a;        /* акцентный текст */
  --cinnabar-ink:#fbe7e2;      /* фон активных чипов */
  --gold:#9a6b06; --jade:#0e7d5d; --indigo:#2f5fa8;
  --t1:#e23d2e; --t2:#9a6b06; --t3:#0e7d5d; --t4:#2f5fa8; --t5:#7f6f5f;
  --ok:#0e7d5d; --bad:#d24a39;
  --r:16px; --rs:11px;
  --shadow:0 10px 26px rgba(150,100,40,.13);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1100px 520px at 85% -12%, rgba(224,162,27,.16), transparent 62%),
    radial-gradient(900px 500px at -10% 8%, rgba(21,158,118,.08), transparent 60%),
    var(--ink);
  color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overscroll-behavior-y:none;
}
.han,.hz{font-family:"Songti SC","Noto Serif SC","STSong","SimSun",serif;}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + var(--safe-b))}
.view{padding:14px 16px 8px;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Верхняя панель */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px 16px 10px;background:linear-gradient(var(--ink) 72%,transparent);
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
.seal{width:40px;height:40px;border-radius:9px;background:var(--cinnabar);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:23px;line-height:1;
  box-shadow:0 4px 12px rgba(226,61,46,.35);position:relative;flex:none}
.seal::after{content:"";position:absolute;inset:4px;border:1.5px solid rgba(255,255,255,.5);border-radius:6px}
.top h1{font-size:16px;margin:0;font-weight:700}
.top .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.top .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;color:var(--paper-dim);box-shadow:var(--shadow);flex:none}
.iconbtn:active{transform:scale(.94)}
.iconbtn.primary{background:var(--cinnabar);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(226,61,46,.3)}

/* Общие блоки */
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:700}
.hero{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--line);
  border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,var(--cinnabar),var(--gold) 55%,var(--jade))}
.hero h2{margin:0 0 4px;font-size:17px;font-weight:700}
.hero p{margin:0 0 12px;color:var(--paper-dim);font-size:13px;line-height:1.45}
.hero + .hero{margin-top:12px}
.duebar{display:flex;gap:10px;margin-bottom:14px}
.duechip{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:var(--rs);padding:10px 6px;text-align:center}
.duechip b{display:block;font-size:22px;line-height:1.1;font-weight:800}
.duechip.new b{color:var(--cinnabar)} .duechip.rev b{color:var(--gold)} .duechip.learn b{color:var(--jade)}
.duechip span{font-size:10.5px;color:var(--muted)}
.btn{display:block;width:100%;text-align:center;background:var(--cinnabar);color:#fff;font-weight:700;
  padding:14px;border-radius:var(--rs);font-size:15px;box-shadow:0 8px 20px rgba(226,61,46,.28)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--paper);box-shadow:var(--shadow)}
.btn.ok{background:var(--jade);box-shadow:0 8px 20px rgba(14,125,93,.25)}
.btn.mini{display:inline-block;width:auto;padding:10px 14px;font-size:13px}
.btn[disabled]{opacity:.5;box-shadow:none;pointer-events:none;background:var(--ink3);color:var(--muted)}
.actionrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actionrow .btn{flex:1;margin:0}
.bar{height:8px;background:var(--ink3);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cinnabar),var(--gold));transition:width .3s}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}
.back{font-size:14px;color:var(--paper-dim);display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-weight:600;padding:4px 0}
h2.title{margin:2px 0 4px;font-size:20px}

/* Списки */
.rowlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface-2)}
.row .n{width:32px;height:32px;border-radius:8px;background:var(--ink);display:grid;place-items:center;
  font-size:12px;color:var(--paper-dim);border:1px solid var(--line);flex:none;font-weight:700}
.row.cur .n{background:var(--cinnabar);color:#fff;border-color:transparent}
.row .tt{flex:1;min-width:0}
.row .tt b{font-size:14px;font-weight:650;display:block}
.row .tt small{color:var(--muted);font-size:11.5px}
.row .cnt{font-size:11px;color:var(--gold);background:var(--ink);border:1px solid var(--line);border-radius:20px;padding:3px 9px;flex:none;font-weight:600}
.row .chev{color:var(--muted);font-size:16px;flex:none}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--paper-dim);font-weight:600}
.pill.k{color:var(--cinnabar-2);border-color:#f0b8ae;background:var(--cinnabar-ink)}
.pill.hsk{color:var(--gold);border-color:#e3c98f}
.pill.ok{color:var(--jade);border-color:#9fd3bf}
.tabs{display:flex;gap:8px;margin:10px 0 12px}
.tab{flex:1;padding:9px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;color:var(--paper-dim);text-align:center;font-weight:600;box-shadow:var(--shadow)}
.tab.on{background:var(--cinnabar-ink);border-color:#f0b8ae;color:var(--cinnabar-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--paper-dim);font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px}
.chip.on{background:var(--cinnabar-ink);border-color:#f0b8ae;color:var(--cinnabar-2)}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;color:var(--paper);font-size:16px;margin-bottom:12px;box-shadow:var(--shadow)}

/* Слово в списке */
.witem{display:flex;align-items:center;gap:13px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.witem:last-child{border-bottom:none}
.witem:active{background:var(--surface-2)}
.witem .hzw{font-size:26px;line-height:1;min-width:36px}
.witem .mid{flex:1;min-width:0}
.witem .py{font-size:13px}
.witem .tr{font-size:12.5px;color:var(--paper-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.st.seen{background:var(--indigo)} .st.due{background:var(--gold)} .st.known{background:var(--jade)}

/* Карточка слова */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 18px 20px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.bighz{font-size:92px;line-height:1.05;margin:4px 0 8px;letter-spacing:2px}
.bigpy{font-size:22px;margin-bottom:6px}
.bigtr{font-size:16px;margin-bottom:2px;font-weight:600}
.bigen{font-size:12.5px;color:var(--muted);margin-top:4px}
.tagrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.cardbtns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.cardbtns .iconbtn{width:48px;height:48px;font-size:20px}
.meta{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.mr{display:flex;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;gap:12px;text-align:left}
.mr:last-child{border-bottom:none}
.mr .k{color:var(--muted);width:104px;flex:none;font-weight:600}
.mr .v{flex:1;min-width:0}

/* Разбор иероглифа */
.bks{display:flex;flex-direction:column;gap:8px;margin-top:10px;text-align:left}
.bk{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;font-size:14px;background:var(--surface);line-height:1.45}
.bkh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bkh .han{font-size:34px;line-height:1.1}
.bk b.han{font-size:19px;font-weight:600}
.bk .lbl{color:var(--muted);font-size:12.5px}
.hz{cursor:pointer;border-radius:4px;border-bottom:1px dotted color-mix(in srgb,var(--cinnabar) 45%,transparent)}
.hz:hover{background:var(--cinnabar-ink)}
.sheet{position:fixed;inset:0;background:rgba(43,33,27,.42);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheetc{background:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--safe-b));max-height:84vh;overflow:auto}

details.strk{margin-top:2px}
details.strk summary{cursor:pointer;color:var(--paper-dim);font-size:13px;font-weight:600}
details.strk ol{margin:6px 0 0;padding-left:22px;font-size:13px;line-height:1.75}
details.strk .sti{vertical-align:middle;margin-right:6px;opacity:.85}
.evo{margin-top:6px}
.evo img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.evocap{display:grid;grid-template-columns:repeat(8,1fr);font-size:9.5px;color:var(--muted);text-align:center;line-height:1.2;margin-top:3px}
.palla{font-size:13px;color:var(--muted);margin-top:2px}
.strow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.strow:last-child{border-bottom:none}
.strow .sti{height:34px;width:46px;object-fit:contain;flex:none}
.strow .num{width:26px;color:var(--muted);font-weight:700;font-size:12px;flex:none}
.strow .nm{flex:1;font-size:14px}
.strow .ex{font-size:20px;letter-spacing:4px}

/* Учёба */
.qwrap{display:flex;flex-direction:column}
.progress{height:5px;background:var(--ink3);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--cinnabar),var(--gold));transition:width .3s}
.qcard{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 16px;text-align:center;box-shadow:var(--shadow);min-height:40vh;position:relative;overflow:hidden}
.qhz{font-size:96px;line-height:1.05;letter-spacing:2px}
.qsub{font-size:14.5px;color:var(--paper-dim);margin-top:14px}
.qprompt{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.qbig{font-size:25px;font-weight:700;line-height:1.3}
.reveal{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;width:100%}
.reveal .py{font-size:20px}.reveal .tr{font-size:17px;margin-top:4px;font-weight:600}
.reveal .en{font-size:12.5px;color:var(--muted);margin-top:6px}
.verdict{font-weight:700;margin-top:8px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.choices{display:grid;gap:9px;margin-top:10px}
.choice{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:16.5px;text-align:center;box-shadow:var(--shadow)}
.choice.correct{background:#e3f3ec;border-color:var(--jade);color:var(--jade)}
.choice.wrong{background:#fbe6e3;border-color:var(--bad);color:var(--bad)}
.tinput{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;
  color:var(--paper);font-size:18px;text-align:center;box-shadow:var(--shadow);margin-top:12px}
.linkbtn{color:var(--muted);font-size:12.5px;margin-top:10px;text-decoration:underline}
.gradebar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grade{padding:14px 6px;border-radius:12px;text-align:center;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.grade small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.grade.g1{color:var(--bad);border-color:#efb3aa}
.grade.g3{color:#fff;background:var(--jade);border-color:transparent}
.showbtn{margin-top:12px}
#writer,.writer{width:250px;height:250px;margin:6px auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);touch-action:none;
  background-image:linear-gradient(90deg,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) calc(50% + .5px),transparent calc(50% + .5px))}
.drawhint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;min-height:18px}

/* Тоны и плитки */
.tn{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.tc{display:flex;flex-direction:column;align-items:center;min-width:48px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tc .han{font-size:24px;line-height:1.2}
.tc .tm{font-size:20px;line-height:1;color:var(--cinnabar);min-height:20px;font-weight:700}
.tc .tp{font-size:12px;color:var(--muted)}
.tc.fix{opacity:.55}
.tc.ok{border-color:var(--jade);background:#e3f3ec}
.tc.bad{border-color:var(--bad);background:#fbe6e3}
.tl{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;margin-top:10px}
.tl.area{border:1px dashed var(--line);border-radius:12px;padding:8px;align-items:center}
.ptile{font-family:"Songti SC","Noto Serif SC",serif;font-size:22px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.ptile.pool{background:var(--surface-2)}

/* Проверочные */
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%;display:block}
.list{display:flex;flex-direction:column;gap:10px}
.sdots{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.sdot{border:1px solid var(--line);background:var(--ink);color:var(--muted);font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px}
.sdot.on{background:var(--jade);border-color:var(--jade);color:#fff}
.sdot.cur{border-color:var(--cinnabar);color:var(--cinnabar-2);box-shadow:0 0 0 1px var(--cinnabar) inset}
.rowbtn{font-weight:700;font-size:14.5px}.rowbtn.ok{color:var(--jade)}
.tip{border-left:4px solid var(--cinnabar)}
.zhl{font-size:21px;line-height:1.5}
.pyl{font-size:14.5px;color:var(--cinnabar-2)}
.rul{font-size:14.5px;color:var(--paper-dim)}
.parts{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}
.wl{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.wl:last-child{border-bottom:none}
.say{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cinnabar-2)}

/* Ключи */
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 6px;text-align:center;box-shadow:var(--shadow)}
.rc .rn{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between}
.rc .han{font-size:30px;line-height:1.2}
.rc .rm{font-size:11.5px;line-height:1.25;color:var(--paper-dim)}
.rc.learned{border-color:#9fd3bf;background:#f1faf6}
.rc.due{border-color:#e3c98f}
.chgrid{display:flex;flex-wrap:wrap;gap:6px}
.chgrid button{font-size:26px;width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}

/* Нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(250,244,231,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;max-width:560px;margin:0 auto;padding-bottom:var(--safe-b)}
.nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--cinnabar)}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.empty .big{font-size:46px;margin-bottom:10px;color:var(--jade)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);
  background:var(--paper);color:var(--ink);padding:11px 17px;border-radius:11px;
  font-size:13px;z-index:70;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;font-weight:600}
.toast.on{opacity:1}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);gap:12px}
.setrow:last-child{border-bottom:none}
.setrow .lab b{font-size:14px}.setrow .lab small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:9px;background:var(--ink3);border:1px solid var(--line);font-size:18px}
.stepper b{min-width:26px;text-align:center;font-size:16px;font-weight:700}
select,input[type=date]{background:var(--ink3);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:8px;font-size:13px;max-width:180px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="seal han">朱</div>
    <div><h1>Тренажёр иероглифов</h1><div class="sub" id="topSub">Кондрашевский, том 1</div></div>
    <div class="spacer"></div>

<script>
/*==================================================================

const DB_RAW = /*__DATA__*/;        // слова и иероглифы (черты, состав)

const LESSONS = /*__LESSONS__*/;    // уроки 1–30: t название, sub, o порядок слов, b блоки тренировки

const RADS = /*__RADS__*/;          // 214 ключей: [номер, черт, пиньинь, рус. название (таблица ДВФУ), формы]
const PALL = /*__PALL__*/;          // система Палладия (таблица курса): слог без тона → кириллица
const RAD2 = /*__RAD2__*/;          // пособие Петросяна (по Канси): №ключа → {m значение, s упрощ., e пример, ep пиньинь, er перевод}
const EVO = '子牛马鱼羊鹿虎象龟步日月山水火雨从车采为';   // таблица «Эволюция графических стилей» (материал курса)
// Черты по таблице курса (24 черты). Ключ — код порядка черт (cnchar, уточнённый по форме черты).
const STROKE_TABLE = [
  ['Основные черты',[[1,'горизонтальная','二五百'],[2,'вертикальная','千士巾'],[3,'откидная вправо','欠又文'],[4,'откидная влево','成石九'],
    [5,'наклонная пересекающаяся','戈戰戒'],[6,'восходящая','冰決波'],[7,'точка вправо','六玉交'],[8,'точка влево','心小亦']]],
  ['Черты с крюком',[[9,'горизонтальная с крюком вниз','皮軍罕'],[10,'вертикальная с крюком влево','水月則'],[11,'вертикальная с крюком вправо','艮衣長'],
    [12,'вертикальная изогнутая с крюком вверх','也巳兒'],[13,'наклонная пересекающаяся','民划戎']]],
  ['Ломаные черты',[[14,'горизонтальная ломаная с вертикальной','口日田'],[15,'горизонтальная ломаная с откидной влево','又久夕'],
    [16,'трижды ломанная с откидной влево','建延廷'],[17,'вертикальная ломаная с горизонтальной','山世凶'],
    [18,'откидная влево ломаная с горизонтальной','厶紅允'],[19,'откидная влево ломаная с откидной вправо','女好妥']]],
  ['Ломаные черты с крюком',[[20,'горизонтальная ломаная с вертикальной и крюком влево','刁力那'],[21,'горизонтальная ломаная с вертикальной и крюком вправо','话讨许'],
    [22,'горизонтальная трижды ломаная с вертикальной и крюком влево','乃鼎汤'],[23,'горизонтальная ломаная с откидной вправо и крюком вверх','汽九肌'],
    [24,'вертикальная дважды ломаная с крюком влево','朽馬与']]],
];
const STROKE_NO = {j:1,f:2,l:3,s:4,i:6,k:7,d:8,E:9,g:10,h:11,u:12,y:13,c:14,e:15,a:16,b:17,n:18,m:19,r:20,p:21,w:22,o:23,z:24};
const STROKE_EXTRA = {Y:'лежачая с крюком (卧钩, как в 心)',t:'изогнутая с крюком (弯钩, как в 子)',v:'горизонтальная дважды ломаная (横折折 / 横折弯)',
  x:'вертикальная дважды ломаная (竖折撇 / 竖折折)',q:'горизонтальная трижды ломаная (横折折折)'};   // нет в таблице курса
const STROKE_NAME = {}; STROKE_TABLE.forEach(([,rows])=>rows.forEach(([n,name])=>{ STROKE_NAME[n]=name; }));
function strokesOf(ch){ const h=HZ.c[ch]; return h&&h[10] ? [...h[10]].map(c=>STROKE_NO[c]?{n:STROKE_NO[c],name:STROKE_NAME[STROKE_NO[c]]}:{n:0,name:STROKE_EXTRA[c]||'черта'}) : []; }
function strokeImg(n,h){ return n?`<img class="sti" src="strokes/${String(n).padStart(2,'0')}.png" alt="" style="height:${h||20}px">`:''; }
// Палладий по таблице курса; слоги через пробел, эрхуа (nǎr) — с «р» на конце
function palladius(p){
  const out=[];
  for(const tok of (p||'').trim().split(/\s+/)){
    let t=toneless(tok); if(!t) continue;
    let er=''; if(t.length>2&&t.endsWith('r')&&!PALL[t]&&PALL[t.slice(0,-1)]){ t=t.slice(0,-1); er='р'; }
    const c=PALL[t]; if(!c) return '';
    out.push(c.toLowerCase()+er);
  }
  return out.join(' ');
}

const WORDS = DB_RAW.words;
const CHARS = DB_RAW.chars;
WORDS.forEach((w,i)=>{ w.id=i; w.key=w.key||w.s; });   // ключ карточки: иероглифы; у омографов — «还:hái»
const BYS = {};                     // иероглифы слова → первое слово с ними
WORDS.forEach(w=>{ if(!(w.s in BYS)) BYS[w.s]=w; });
const BYK = {};                     // ключ карточки → слово
WORDS.forEach(w=>{ BYK[w.key]=w; });
const NL = 30;                      // уроков в томе 1
const RIDX = {};                    // форма ключа → индекс в RADS
RADS.forEach((r,i)=>{ for(const ch of r[4]) if(!(ch in RIDX)) RIDX[ch]=i; });
{ const A={'丷':'八','⺊':'卜','母':'毋','㔾':'卩','乛':'乙','⺀':'冫','民':'氏','旡':'无','虎':'虍'};
  for(const k in A) if(RIDX[A[k]]!=null) RIDX[k]=RIDX[A[k]]; }
const isHan = c => c>='一' && c<='鿿';
const hanOf = s => [...s].filter(isHan);
function radOf(c){ const h=HZ.c[c]; return h? h[0] : 0; }           // номер ключа Канси
function lessonWords(L){ return ((LESSONS[L]||{}).o||[]).map(k=>BYK[k]).filter(Boolean); }
function lessonExtras(L){ return ((LESSONS[L]||{}).x||[]).map(x=>({...x,words:x.o.map(k=>BYK[k]).filter(Boolean)})); }   // список группы, презентации
function lessonTitle(L){ return (LESSONS[L]&&LESSONS[L].t) || ('Урок '+L); }

// Где иероглиф и ключ появляются впервые; общий порядок изучения курса
const CHAR_L={}, RAD_L={}, LESSON_CHARS={}, LESSON_RADS={}, WORD_L={}, EXTRA_OF={};
const COURSE=[];                    // ключи карточек: слово или 'r:N' — ключ №N
for(let L=1;L<=NL;L++){
  LESSON_CHARS[L]=[]; LESSON_RADS[L]=[];
  const add=w=>{
    hanOf(w.s).forEach(c=>{
      if(c in CHAR_L) return;
      CHAR_L[c]=L; LESSON_CHARS[L].push(c);
      const k=radOf(c);
      if(k && !(k in RAD_L)){ RAD_L[k]=L; LESSON_RADS[L].push(k); COURSE.push('r:'+k); }   // ключ — перед первым словом с ним
    });
    if(!(w.key in WORD_L)){ WORD_L[w.key]=L; COURSE.push(w.key); }
  };
  lessonWords(L).forEach(add);
  lessonExtras(L).forEach(x=>x.words.forEach(w=>{ if(!(w.key in EXTRA_OF)) EXTRA_OF[w.key]=x.title; add(w); }));   // после урока — слова группы
}

/*==================================================================
  ХРАНИЛИЩЕ: IndexedDB (в превью без хранилища — память)
==================================================================*/
const Store = (()=>{
  let mem={}, idb=null, ok=false;
  function open(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open('hanzi-trainer',1);
        r.onupgradeneeded=e=>{ e.target.result.createObjectStore('kv'); };
        r.onsuccess=e=>{ idb=e.target.result; ok=true; res(true); };
        r.onerror=()=>res(false);
        setTimeout(()=>{ if(!ok) res(false); },800);
      }catch(e){ res(false); }
    });
  }
  function get(k){
    if(!ok) return Promise.resolve(mem[k]);
    return new Promise(res=>{ const t=idb.transaction('kv','readonly').objectStore('kv').get(k);
      t.onsuccess=()=>res(t.result); t.onerror=()=>res(mem[k]); });
  }
  function set(k,v){
    mem[k]=v; if(!ok) return Promise.resolve();
    return new Promise(res=>{ const t=idb.transaction('kv','readwrite').objectStore('kv').put(v,k);
      t.onsuccess=()=>res(); t.onerror=()=>res(); });
  }
  return {open,get,set,persistent:()=>ok};
})();

/*==================================================================
  FSRS-5 — интервальное повторение (стандартные веса)
==================================================================*/
const FSRS = (()=>{
  const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,
           0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
  const DECAY=-0.5, F=Math.pow(0.9,1/DECAY)-1;
  const clampD=d=>Math.min(Math.max(d,1),10), clampS=s=>Math.max(s,0.01);
  const D0=g=>clampD(W[4]-Math.exp(W[5]*(g-1))+1), S0=g=>clampS(W[g-1]);
  const retr=(t,S)=>Math.pow(1+F*t/S,DECAY);
  function nextD(D,g){ let d=D-W[6]*(g-3); d=D+(d-D)*(10-D)/9; return clampD(W[7]*D0(4)+(1-W[7])*d); }
  function sSucc(D,S,r,g){ const h=g===2?W[15]:1, e=g===4?W[16]:1;
    return clampS(S*(1+Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-r))-1)*h*e)); }
  function sFail(D,S,r){ return clampS(Math.min(W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-r)),S)); }
  function interval(S,req){ return Math.max(1,Math.round(S/F*(Math.pow(req,1/DECAY)-1))); }
  const DAY=864e5;
  // card: {S,D,due,last,reps,lapses,state}; state 0 — новая, 1 — в повторении
  function review(card,g,req){
    const now=Date.now(); const c=Object.assign({},card);
    if(!c.state){ c.S=S0(g); c.D=D0(g); c.reps=1; c.lapses=g===1?1:0; c.state=1; }
    else{
      const t=Math.max(0,(now-(c.last||now))/DAY), r=retr(t,c.S);
      if(g===1){ c.S=sFail(c.D,c.S,r); c.lapses=(c.lapses||0)+1; } else c.S=sSucc(c.D,c.S,r,g);
      c.D=nextD(c.D,g); c.reps=(c.reps||0)+1;
    }
    c.last=now;
    c.due = g===1 ? now+6*6e4 : now+interval(c.S,req)*DAY;   // «Не помню» — через ~6 мин, в этой же сессии
    return c;
  }
  return {review};
})();

/*==================================================================
  СОСТОЯНИЕ
==================================================================*/
const REQ=0.90, SESSION_CAP=20, RAD_PER_DAY=5;
const State = {
  cards:{},                                  // ключ (иероглифы слова или 'r:N') → карточка FSRS
  settings:{ newPerDay:12, lesson:18, voiceName:null },
  meta:{ day:'', newToday:0, radToday:0, rev:{} },
  tp:{},                                     // прогресс подготовки к проверочным: id → {done:{шаг:1}, final:[a,b], date}
  route:{ name:'home' }, tab:'home',
};
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return dstr(new Date()); }
async function loadState(){
  await Store.open();
  const c=await Store.get('cards'); if(c) State.cards=c;
  const ks=Object.keys(State.cards);          // самый старый формат: числовые индексы → ключи-иероглифы
  if(ks.length && ks.every(k=>/^\d+$/.test(k))){
    const nc={}; ks.forEach(k=>{ const w=WORDS[+k]; if(w) nc[w.s]=State.cards[k]; });
    State.cards=nc; await Store.set('cards',nc);
  }
  const s=await Store.get('settings');
  if(s){ ['newPerDay','lesson','voiceName'].forEach(k=>{ if(s[k]!==undefined) State.settings[k]=s[k]; }); }
  State.settings.lesson=Math.min(NL,Math.max(1,+State.settings.lesson||18));
  const m=await Store.get('meta'); if(m) Object.assign(State.meta,m);
  State.meta.rev=State.meta.rev||{};
  if(State.meta.day!==todayStr()){ State.meta.day=todayStr(); State.meta.newToday=0; State.meta.radToday=0; await save('meta'); }
  const tp=await Store.get('tests'); if(tp) State.tp=tp;
}
async function save(what){
  if(!what||what==='cards') await Store.set('cards',State.cards);
  if(!what||what==='settings') await Store.set('settings',State.settings);
  if(!what||what==='meta') await Store.set('meta',State.meta);
  if(!what||what==='tests') await Store.set('tests',State.tp);
}

/*==================================================================
  КАРТОЧКИ И ОЧЕРЕДИ
==================================================================*/
const isRad = k => typeof k==='string' && k.startsWith('r:');
const radNum = k => +k.slice(2);
const validKey = k => isRad(k) ? (radNum(k)>=1&&radNum(k)<=214) : (k in BYK);
const cardOf = k => State.cards[k];
const isNew = k => { const c=cardOf(k); return !c||!c.state; };
const isDue = k => { const c=cardOf(k); return !!(c&&c.state&&c.due<=Date.now()); };
function statusOf(k){ const c=cardOf(k); if(!c||!c.state) return 'new'; if(c.due<=Date.now()) return 'due'; return c.S>=21?'known':'seen'; }
function learnedCount(keys){ return keys.filter(k=>!isNew(k)).length; }
function dueKeys(filter){
  return Object.keys(State.cards).filter(k=>validKey(k)&&isDue(k)&&(!filter||filter(k))).sort((a,b)=>cardOf(a).due-cardOf(b).due);
}
// Урок дня: повторения + новые по курсу (уроки по порядку, ключ — перед первым словом с ним)
function dailyQueue(){
  const due=dueKeys();
  let wb=Math.max(0,State.settings.newPerDay-(State.meta.newToday||0));
  let rb=wb>0 ? Math.max(0,RAD_PER_DAY-(State.meta.radToday||0)) : 0;
  const fresh=[];
  for(const k of COURSE){
    if(!wb && !rb) break;
    if(!isNew(k)) continue;
    if(isRad(k)){ if(rb){ fresh.push(k); rb--; } }
    else if(wb){ fresh.push(k); wb--; }
  }
  return due.concat(fresh).slice(0,SESSION_CAP);
}
// Очередь по набору (урок, ключи, HSK): повторения набора + все новые по порядку, порциями
function poolQueue(keys){
  const set=new Set(keys);
  const due=dueKeys(k=>set.has(k));
  const fresh=keys.filter(isNew);
  return due.concat(fresh).slice(0,SESSION_CAP);
}
function lessonKeys(L){ return LESSON_RADS[L].map(n=>'r:'+n).concat(lessonWords(L).map(w=>w.key)); }
function courseKeys(N){ const o=[]; for(let L=1;L<=N;L++){ o.push(...lessonKeys(L)); lessonExtras(L).forEach(x=>o.push(...x.words.map(w=>w.key))); } return [...new Set(o)]; }

/*==================================================================
  ПИНЬИНЬ
==================================================================*/
const TONE_MAP={'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
  'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
  'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],'ǖ':['ü',1],'ǘ':['ü',2],'ǚ':['ü',3],'ǜ':['ü',4],
  'ü':['ü',5],'ń':['n',2],'ň':['n',3],'ǹ':['n',4]};
function syllTone(s){ for(const ch of s){ if(TONE_MAP[ch]&&TONE_MAP[ch][1]<5) return TONE_MAP[ch][1]; } return 5; }
function toneless(s){ let o=''; for(const ch of (s||'').toLowerCase()){ o+=TONE_MAP[ch]?TONE_MAP[ch][0]:ch; } return o.replace(/ü/g,'v').replace(/[^a-z0-9]/g,''); }
function pinyinHTML(py){
  return (py||'').split(/(\s+)/).map(t=>/^\s*$/.test(t)?t:'<span style="color:var(--t'+syllTone(t)+')">'+esc(t)+'</span>').join('');
}
function wordSylls(w){ const s=w.p.trim().split(/\s+/); return s.length===hanOf(w.s).length ? s : null; }

/*==================================================================
  ОЗВУЧКА: аудио-пак ./audio (если выложен) или голос устройства
==================================================================*/
const Speech=(()=>{
  let voices=[], chosen=null, prefName=null, pack=null;
  fetch('./audio/manifest.json').then(r=>r.ok?r.json():null).then(j=>{ if(Array.isArray(j)&&j.length) pack=new Set(j); }).catch(()=>{});
  function refresh(){ voices=speechSynthesis.getVoices()||[];
    const zh=voices.filter(v=>/zh|cmn|chinese/i.test(v.lang+v.name));
    chosen=(prefName&&zh.find(v=>v.name===prefName))||zh.find(v=>/CN|Hans|普通话|Ting|Mandarin/i.test(v.name+v.lang))||zh[0]||null; }
  if('speechSynthesis' in window){ refresh(); speechSynthesis.onvoiceschanged=refresh; }
  function tts(text,rate){
    if(!('speechSynthesis' in window)){ toast('Озвучка недоступна в этом браузере'); return; }
    if(!chosen) refresh();
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/——/g,'，'));
      u.lang='zh-CN'; if(chosen) u.voice=chosen; u.rate=rate||.82; speechSynthesis.speak(u); }catch(e){}
  }
  function say(text,rate){
    if(!text) return;
    if(pack&&pack.has(text+'.mp3')){
      try{ const a=new Audio('./audio/'+encodeURIComponent(text+'.mp3')); if(rate&&rate<.7) a.playbackRate=.7; a.play().catch(()=>tts(text,rate)); return; }catch(e){}
    }
    tts(text,rate);
  }
  function stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
  return {say,stop,has:()=>('speechSynthesis' in window)||!!pack,voice:()=>chosen,
    setPref(n){ prefName=n||null; if('speechSynthesis' in window) refresh(); },
    list(){ if('speechSynthesis' in window) refresh(); return voices.filter(v=>/zh|cmn|chinese/i.test(v.lang+v.name)); },
    source(){ return pack?('аудио-пак ('+pack.size+' файлов)'):(chosen?chosen.name:'системный синтез'); }};
})();

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
function esc(s){ return (s+'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function meaning(w){ return w.ru||(w.en&&w.en[0])||'—'; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const uniq = a => [...new Set(a)];
function others(list,right,n){ return shuffle(uniq(list).filter(x=>x!==right)).slice(0,n); }   // n неверных вариантов, без повторов
// иероглифы в тексте → кликабельные (разбор по нажатию)
function wrapHz(t){ return esc(t).replace(/[一-鿿]/g,c=>HZ.c[c]?'<span class="hz" data-c="'+c+'">'+c+'</span>':c); }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2000); }
const RUM=['янв.','февр.','марта','апр.','мая','июня','июля','авг.','сент.','окт.','нояб.','дек.'];
function fmtDate(s){ const p=(s||'').split('-').map(Number); return p.length===3? p[2]+' '+RUM[p[1]-1] : ''; }
function daysTo(s){ const p=(s||'').split('-').map(Number); if(p.length!==3) return null;
  const t=new Date(); return Math.round((new Date(p[0],p[1]-1,p[2])-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); }
function whenText(d){ return d===0?'сегодня':d===1?'завтра':d>1?'через '+d+' '+plural(d,'день','дня','дней'):d<0?'прошла':''; }
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; return n>10&&n<20?c:n1>1&&n1<5?b:n1===1?a:c; }

/*==================================================================
  РАЗБОР ИЕРОГЛИФА: ключ, состав, смысл/звук
==================================================================*/
const TYPES={p:'смысл + звук',i:'составной по смыслу',g:'рисунок (пиктограмма)'};
const IDC=/[⿰⿱⿲⿳⿴⿵⿶⿷⿸⿹⿺⿻]/g;
function radName(n){ const r=RADS[n-1]; return r? '«'+r[3]+'»' : ''; }
function compLabel(p,ch){
  if(p==='？') return '<span class="lbl">часть без отдельного названия</span>';
  let n=null;
  if(p==='阝'){ const h=HZ.c[ch]; n = h&&(h[0]===163||h[0]===170) ? h[0] : (h&&h[2].startsWith('⿰阝')?170:163); }   // слева — «холм», справа — «город»
  else if(RIDX[p]!=null) n=RADS[RIDX[p]][0];
  const self=HZ.c[p];
  if(self && p!==ch){
    const m=self[6]||(n?RADS[n-1][3]:'');
    return `<b class="han hz" data-c="${p}">${p}</b> <span class="lbl">${esc(self[7])}${m?' · '+esc(m):''}${n?' · ключ '+n:''}</span>`;
  }
  if(n) return `<b class="han">${p}</b> <span class="lbl">ключ ${n} ${esc(radName(n))}</span>`;
  const c=HZ.p[p];
  if(c) return `<b class="han">${p}</b> <span class="lbl">${esc(c[0])}${c[1]?' · '+esc(c[1]):''}</span>`;
  return `<b class="han">${p}</b>`;
}
function charBox(ch,opts){
  const h=HZ.c[ch]; if(!h) return '';
  const [kx,form,ids,type,sem,phon,ru0,py,alt]=h; const r=RADS[kx-1];
  const ru = ru0 || (RIDX[ch]!=null&&RADS[RIDX[ch]][0]===kx ? 'ключ «'+RADS[kx-1][3]+'»' : '');
  const parts=(ids||'').replace(IDC,'').split('').filter(Boolean);
  const isSelf = parts.length===0 || RIDX[ch]!=null && RADS[RIDX[ch]][0]===kx;
  let sostav;
  if(!parts.length || parts.every(p=>p==='？')) sostav = isSelf ? 'сам является ключом, не делится' : 'не делится';
  else sostav = parts.map(p=>compLabel(p,ch)).join(' + ');
  const strokes = CHARS[ch] ? CHARS[ch][0]+' черт' : '';
  const where = CHAR_L[ch] ? 'урок '+CHAR_L[ch] : '';
  return `<div class="bk">
    <div class="bkh"><span class="han">${ch}</span><span style="font-size:17px">${pinyinHTML(py)}</span>${palladius(py.split(' / ')[0])?`<span class="lbl">${esc(palladius(py.split(' / ')[0]))}</span>`:''}<span class="lbl">${[strokes,where].filter(Boolean).join(' · ')}</span></div>
    ${ru?`<div style="font-weight:650">${esc(ru)}</div>`:(h[9]?`<div class="lbl">${esc(h[9])}</div>`:'')}
    <div><span class="lbl">Ключ:</span> <b class="han">${esc(form)}</b> — №${kx} <span class="han">${r[4][0]}</span> ${esc(r[2])}, ${esc(radName(kx))}${alt?` <span class="lbl">(в других словарях — №${alt} ${RADS[alt-1]?esc(RADS[alt-1][4][0]):''})</span>`:''}</div>
    <div><span class="lbl">Состав:</span> ${sostav}</div>
    ${type?`<div class="lbl">Тип: ${TYPES[type]}${type==='p'&&(sem||phon)?` — смысловая часть <b class="han">${esc(sem||'—')}</b>, звуковая <b class="han">${esc(phon||'—')}</b>`:''}</div>`:''}
    ${(()=>{ const st=strokesOf(ch); return st.length?`<details class="strk"><summary>Порядок черт (${st.length}) — по таблице черт курса</summary><ol>${st.map(x=>`<li>${strokeImg(x.n,18)}${esc(x.name)}${x.n?` <span class="lbl">№${x.n}</span>`:' <span class="lbl">(нет в таблице)</span>'}</li>`).join('')}</ol></details>`:''; })()}
    ${EVO.includes(ch)?`<div class="evo"><div class="lbl">Эволюция написания (таблица курса):</div><img src="evolution/${ch.codePointAt(0).toString(16)}.jpg" loading="lazy" alt="эволюция ${ch}"><div class="evocap"><span>Инь, гадат. надписи</span><span>Чжоу, бронза</span><span>сяо-чжуань</span><span>лишу</span><span>кайшу</span><span>цаошу</span><span>синшу</span><span>сокращ.</span></div></div>`:''}
    ${opts&&opts.actions?`<div class="actionrow" style="margin-top:6px"><button class="say" data-say="${ch}">🔊 Слушать</button><button class="say" data-draw="${ch}">笔 Прописи</button></div>`:''}
  </div>`;
}
function hzBtn(c){ const b=el('button','han',c); b.dataset.c=c; b.setAttribute('aria-label','разбор '+c); return b; }
function breakdown(s){ const cs=[...new Set(hanOf(s))].filter(c=>HZ.c[c]); return cs.length? `<div class="bks">${cs.map(c=>charBox(c)).join('')}</div>` : ''; }
function openSheet(html){
  $('#sheetc').innerHTML=html+'<div class="actionrow"><button class="btn ghost" id="sheetClose">Закрыть</button></div>';
  $('#sheet').hidden=false; $('#sheetClose').onclick=closeSheet;
}
function closeSheet(){ $('#sheet').hidden=true; }
function openChar(ch){
  const words=WORDS.filter(w=>w.s.includes(ch)).sort((a,b)=>((WORD_L[a.key]||99)-(WORD_L[b.key]||99))||(a.s.length-b.s.length)).slice(0,10);
  openSheet(charBox(ch,{actions:true}) + (words.length?`<p class="eyebrow">Слова с ${ch}</p><div class="rowlist">${words.map(w=>`<button class="witem" data-word="${w.id}"><div class="hzw han">${esc(w.d||w.s)}</div><div class="mid"><div class="py">${pinyinHTML(w.p)}</div><div class="tr">${esc(meaning(w))}</div></div>${WORD_L[w.key]?`<span class="pill k">ур. ${WORD_L[w.key]}</span>`:''}</button>`).join('')}</div>`:''));
}

// глобально: тап по иероглифу — разбор; кнопки 🔊 / 笔 внутри разбора
document.addEventListener('click',e=>{

const TAB_OF={home:'home',lessons:'lessons',lesson:'lessons',extra:'lessons',strokes:'keys',tests:'tests',test:'tests',keys:'keys',radical:'keys',dict:'dict',list:'dict'};
function go(name,params){
  State.route={name,...params}; if(TAB_OF[name]) State.tab=TAB_OF[name];
  closeSheet(); clearTimeout(playT); Speech.stop(); render(); window.scrollTo(0,0);
}
function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===State.tab));
  $('#topSub').textContent='Кондрашевский · урок группы '+State.settings.lesson;
  const V={home:viewHome,lessons:viewLessons,lesson:viewLesson,extra:viewExtra,strokes:viewStrokes,card:viewCard,session:viewSession,draw:viewDraw,
    tests:viewTests,test:viewTest,keys:viewKeys,radical:viewRadical,dict:viewDict,list:viewList,settings:viewSettings};
  const s=$('#screen'); s.innerHTML=''; (V[State.route.name]||viewHome)(s);
}
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(b.dataset.nav); });
$('#btnSettings').onclick=()=>go('settings');
// Клавиатура: Пробел/Enter — показать/дальше, 1/← — не помню, 2/→ — помню, 1–4 — варианты, Backspace — отменить
document.addEventListener('keydown',e=>{
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(!$('#sheet').hidden){ if(e.key==='Escape') closeSheet(); return; }
  const scr=$('#screen'); let b=null;
  if(/^[1-4]$/.test(e.key)) b=scr.querySelector('[data-ch="'+e.key+'"]');
  if(!b){ const k={' ':'space','Enter':'space','1':'1','2':'2','ArrowLeft':'1','ArrowRight':'2','Backspace':'undo'}[e.key];
    if(k) b=scr.querySelector('[data-key="'+k+'"]'); }
  if(b&&!b.disabled){ e.preventDefault(); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); b.click(); }
});

function streakDays(){
  const rev=State.meta.rev||{}; const d=new Date();
  if(!(rev[dstr(d)]>0)) d.setDate(d.getDate()-1);
  let s=0; while(rev[dstr(d)]>0){ s++; d.setDate(d.getDate()-1); } return s;
}
function nextTest(){
  const list=TESTS.map(t=>({t,d:daysTo(testDate(t))})).filter(x=>x.d!=null&&x.d>=0).sort((a,b)=>a.d-b.d);
  return list[0]||null;
}

    const tb=el('button','btn mini','Готовиться ›'); tb.onclick=()=>go('test',{home:1,tid:nt.t.id}); tc.appendChild(tb);
  }else{
    const t=autoTest(N), st=testStats(t);
    tc.innerHTML=`<div class="kind">тренировка к проверочной</div><h2 style="margin-top:4px">Урок ${N}: предложения урока</h2>
      <p>Разбор → слова → тоны → порядок слов → перевод → диктант. Пройдено ${st.done} из ${st.total}.</p>`;
    const tb=el('button','btn mini','Готовиться ›'); tb.onclick=()=>go('test',{home:1,tid:t.id}); tc.appendChild(tb);

  const lw=learnedCount(wk), lr=learnedCount(rk), left=wk.length-lw, pct=wk.length?Math.round(lw/wk.length*100):0;

  s.appendChild(v);
}

function witem(w){

/*==================================================================
  СЕССИЯ ЗАУЧИВАНИЯ
  Режим «Авто» подбирает задание по прочности памяти (S, дни):
  новое → знакомство; слабое → узнавание/выбор/на слух; среднее → вспомнить,
  тоны, пиньинь; прочное → написать иероглиф, диктант.
==================================================================*/
let SESSION=null;
function startSession(queue,mode,title,more){
  queue=queue.filter(validKey);
  if(!queue.length){ toast('Нечего повторять — всё сделано'); return; }
  SESSION={queue:queue.slice(),mode:mode||'auto',title,more,total:queue.length,done:0,again:[],fails:{},intro:{},current:null,cur:null,last:null};
  go('session');
}
function nextItem(){ return SESSION.queue.length?SESSION.queue.shift():SESSION.again.length?SESSION.again.shift():null; }
function canWrite(w){ return typeof HanziWriter!=='undefined' && hanOf(w.s).length>0 && hanOf(w.s).length<=4 && hanOf(w.s).every(c=>CHARS[c]); }
function pickMode(w){
  let m=SESSION.mode;
  if(m==='auto'){
    const c=cardOf(w.key), S=c&&c.state?c.S:0;
    const pool = S<2 ? ['recog','recog','choice','listen'] : S<10 ? ['recog','recall','produce','tones','pinyin','listen'] : ['recall','write','write','dictate','tones','produce'];
    m=pool[Math.random()*pool.length|0];
  }
  if((m==='listen'||m==='dictate')&&!Speech.has()) m='recog';
  if((m==='write'||m==='dictate')&&!canWrite(w)) m= m==='dictate'?'listen':'recall';
  if(m==='tones'&&!wordSylls(w)) m='recog';
  return m;
}
function viewSession(s){
  if(!SESSION){ go('home'); return; }
  let key=SESSION.current!=null?SESSION.current:nextItem();
  if(key==null) return sessionDone(s);
  if(SESSION.current!==key){ SESSION.current=key; SESSION.cur=null; }
  const v=el('div','view qwrap');
  const hdr=el('div',''); hdr.style.cssText='display:flex;align-items:center;justify-content:space-between';
  const back=el('button','back','✕ '+esc(SESSION.title||'Завершить')); back.onclick=()=>{ SESSION.finished=true; go('home'); }; hdr.appendChild(back);
  if(SESSION.last){ const ub=el('button','back','↩ Отменить'); ub.dataset.key='undo'; ub.onclick=undoLast; hdr.appendChild(ub); }
  v.appendChild(hdr);
  v.appendChild(el('div','progress',`<i style="width:${Math.min(100,SESSION.done/Math.max(1,SESSION.total)*100)|0}%"></i>`));
  const stage=el('div',''); v.appendChild(stage); s.appendChild(v);
  if(isRad(key)){
    const n=radNum(key);
    if(isNew(key)&&!SESSION.intro[key]) return radIntro(stage,n);
    if(!SESSION.cur) SESSION.cur=Math.random()<.5?'rname':'rform';
    return SESSION.cur==='rname'?qRadName(stage,n):qRadForm(stage,n);
  }
  const w=BYK[key];
  if(isNew(key)&&!SESSION.intro[key]) return qIntro(stage,w);
  if(!SESSION.cur) SESSION.cur=pickMode(w);
  ({recog:qRecog,choice:qChoice,produce:qProduce,recall:qRecall,pinyin:qPinyin,listen:qListen,tones:qTones,write:qWrite,dictate:qDictate}[SESSION.cur]||qRecog)(stage,w);
}
function gradeSelf(stage,okText,badText){
  const bar=el('div','gradebar');
  const b1=el('button','grade g1',(badText||'Не помню')+'<small>1 · ←</small>'); b1.dataset.key='1'; b1.onclick=()=>afterGrade(1);
  const b2=el('button','grade g3',(okText||'Помню')+'<small>2 · →</small>'); b2.dataset.key='2'; b2.onclick=()=>afterGrade(3);
  bar.appendChild(b1); bar.appendChild(b2); stage.appendChild(bar);
}
function gradeAuto(stage,g){
  const b=el('button','btn showbtn','Дальше ›'); b.dataset.key='space'; b.onclick=()=>afterGrade(g); stage.appendChild(b);
}
function showBtn(stage,fn,label){ const b=el('button','btn showbtn',label||'Показать ответ'); b.dataset.key='space'; b.onclick=()=>{ b.remove(); fn(); }; stage.appendChild(b); return b; }
function answerHTML(w,extra){
  return `<div class="reveal"><div class="py">${pinyinHTML(w.p)}</div><div class="tr">${esc(meaning(w))}</div>
    ${w.ex?`<div class="en han" style="font-size:15px;margin-top:8px">${wrapHz(w.ex[0])}</div><div class="en">${esc(w.ex[2])}</div>`:''}${extra||''}</div>`;
}
function afterGrade(g){
  if(!SESSION||SESSION.current==null) return;
  const key=SESSION.current, wasNew=isNew(key);
  SESSION.last={key,wasNew,g,prev:cardOf(key)?JSON.parse(JSON.stringify(cardOf(key))):null,hadFail:!!SESSION.fails[key]};
  State.cards[key]=FSRS.review(cardOf(key)||{},g,REQ);
  if(wasNew){ if(isRad(key)) State.meta.radToday=(State.meta.radToday||0)+1; else State.meta.newToday=(State.meta.newToday||0)+1; }
  const d=todayStr(); State.meta.rev[d]=(State.meta.rev[d]||0)+1;
  if(g===1){ SESSION.again.push(key); SESSION.fails[key]=1; }
  SESSION.done++; SESSION.current=null; SESSION.cur=null;
  save('cards'); save('meta'); render();
}
function undoLast(){
  const L=SESSION&&SESSION.last; if(!L) return;
  if(L.prev) State.cards[L.key]=L.prev; else delete State.cards[L.key];
  if(L.wasNew){ if(isRad(L.key)) State.meta.radToday=Math.max(0,(State.meta.radToday||0)-1); else State.meta.newToday=Math.max(0,(State.meta.newToday||0)-1); }
  const d=todayStr(); if(State.meta.rev[d]>0) State.meta.rev[d]--;
  if(L.g===1){ const i=SESSION.again.lastIndexOf(L.key); if(i>-1) SESSION.again.splice(i,1); if(!L.hadFail) delete SESSION.fails[L.key]; }
  if(SESSION.current!=null && SESSION.current!==L.key) SESSION.queue.unshift(SESSION.current);
  SESSION.done=Math.max(0,SESSION.done-1); SESSION.current=L.key; SESSION.cur=null; SESSION.last=null;
  save('cards'); save('meta'); render();
}

const HWC={stroke:'#e23d2e',outline:'#e2d3b8',draw:'#2b211b',hl:'#c98a0e'};
function writeQuiz(host,chars,onDone){
  let idx=0, mistakes=0; host.innerHTML='<div class="writer" id="wq"></div><div class="drawhint" id="wqHint"></div>';
  function mount(){
    const hint=$('#wqHint'); $('#wq').innerHTML='';
    hint.textContent=chars.length>1?'Иероглиф '+(idx+1)+' из '+chars.length:'Пиши по чертам';
    try{
      const inst=HanziWriter.create('wq',chars[idx],{width:230,height:230,padding:8,showCharacter:false,showOutline:false,
        strokeColor:HWC.stroke,drawingColor:HWC.draw,highlightColor:HWC.hl,charDataLoader:(c,ok)=>hwData(c,ok,()=>{ hint.textContent='нет данных о чертах (нужна сеть)'; })});
      const SN=strokesOf(chars[idx]);
      inst.quiz({showHintAfterMisses:3,onMistake:st=>{ mistakes++; if(SN[st.strokeNum]) hint.textContent='Черта '+(st.strokeNum+1)+': '+SN[st.strokeNum].name; },
        onComplete:()=>{ idx++; if(idx<chars.length){ hint.textContent='✓'; setTimeout(mount,400); } else onDone(mistakes); }});
    }catch(e){ hint.textContent='прописи недоступны'; onDone(99); }
  }

}

const STEPS={learn:'Разбор',words:'Слова',tones:'Тоны',tiles:'Порядок слов',hear:'На слух → РУ',write:'РУ → 中',dict:'Диктант'};
const KIND_STEPS={'диктант':['learn','words','tones','dict']};
const FULL_STEPS=['learn','words','tones','tiles','hear','write','dict'];
const AUTO={};
function autoTest(L){
  if(AUTO[L]) return AUTO[L];
  const blocks=(LESSONS[L].b||[]).map((b,i)=>({id:'b'+(i+1),title:'Блок '+(i+1),tip:'',u:b.u,
    w:b.w.map(k=>BYK[k]).filter(Boolean).map(w=>[w.d||w.s,w.p,meaning(w)]),tl:b.tl,auto:true}));
  return AUTO[L]={id:'L'+L,kind:'тренировка',lesson:L,title:'Урок '+L+' · тренировка к проверочной',auto:true,
    note:'Собрано автоматически из примеров учебника к словам урока: только пройденная лексика. Настоящие предложения проверочной добавляются отдельно.',blocks};
}
function getTest(id){ return TESTS.find(t=>t.id===id) || (/^L\d+$/.test(id)&&LESSONS[+id.slice(1)]?autoTest(+id.slice(1)):null); }
function tpOf(id){ return State.tp[id]||(State.tp[id]={done:{}}); }

function testPath(t){
  const steps=KIND_STEPS[t.kind]||FULL_STEPS, P=[], nb=t.blocks.length;
  t.blocks.forEach((b,bi)=>{
    steps.forEach(s=>{ if(s==='tiles'&&!(b.tl&&b.tl.length)) return; if(s==='tones'&&!b.u.some(u=>u.sy)) return; P.push({id:b.id+':'+s,b:bi,s,n:STEPS[s]}); });
    if(nb>3&&((bi+1)%3===0||bi===nb-1)) P.push({id:'rev'+bi,s:'review',upto:bi,n:'Повторение: блоки 1–'+(bi+1)});

  return P;
}

function unitItem(u,src){

function frags(b){ const o=[]; b.u.forEach(u=>{ (u.parts||[]).forEach(p=>o.push({ru:p[0],zh:p[1],py:p[2],src:b.title+', отрывок'})); o.push({ru:u.ru,zh:u.zh,py:u.py,src:b.title}); }); return o; }
function wholes(b){ return b.u.map(u=>({ru:u.ru,zh:u.zh,py:u.py,src:b.title})); }
function tTasks(t,p){
  const b=t.blocks[p.b];
  if(p.s==='words') return shuffle(b.w).map(w=>({k:'flash',dir:'zh',w})).concat(shuffle(b.w).map(w=>({k:'flash',dir:'ru',w})));
  if(p.s==='tones') return b.u.filter(u=>u.sy).map(u=>({k:'tone',u}));
  if(p.s==='tiles') return shuffle(b.tl).map(x=>({k:'tiles',x,auto:b.auto}));
  if(['hear','write','dict'].includes(p.s)) return frags(b).map(f=>({k:p.s,f}));
  if(p.s==='review'){ const o=[]; for(let i=0;i<=p.upto;i++) wholes(t.blocks[i]).forEach((f,j)=>o.push({k:j%2?'hear':'write',f})); return shuffle(o); }
  if(p.s==='exam'){ const o=[]; t.blocks.forEach(b=>frags(b).forEach(f=>o.push({k:Math.random()<.5?'write':'hear',f}))); return shuffle(o); }
  if(p.s==='final'){ const o=[]; t.blocks.forEach(b=>wholes(b).forEach(f=>{ o.push({k:'write',f}); o.push({k:'hear',f}); })); return shuffle(o); }
  return [];
}
function tStart(t,i){
  const p=testPath(t)[i];
  Object.assign(T,{p:i,err:0,first:0,firstOk:0,open:false,played:null});
  if(p.s==='learn'){ T.q=[]; tGo('learn'); }
  else{ T.q=tTasks(t,p); T.q.forEach(x=>x.tries=0); T.total=T.q.length; if(!T.total){ tFinish(t); return; } tGo('run'); }
}
function tFinish(t){
  const p=testPath(t)[T.p], tp=tpOf(t.id); tp.done[p.id]=1;
  if(p.s==='final') tp.final=[T.firstOk,T.first];
  save('tests'); tGo('stepdone');
}
function tAnswer(t,ok){
  if(!T||!T.q||!T.q.length) return;
  const x=T.q.shift(); if(!x.tries){ T.first++; if(ok) T.firstOk++; } x.tries++;
  const strict=['exam','final'].includes(testPath(t)[T.p].s);
  if(ok){ x.need=(x.need||1)-1; if(x.need>0) T.q.splice(Math.min(T.q.length,4),0,x); }
  else{ T.err++; x.need=strict?2:1; T.q.splice(Math.min(T.q.length,3),0,x); }
  T.open=false; T.played=null;
  if(!T.q.length) tFinish(t); else tGo('run');
}
function tTop(v,t,extra){
  const p=testPath(t)[T.p];
  const bar=el('div',''); bar.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px';
  const b=el('button','back','‹ План'); b.onclick=()=>tGo('home'); bar.appendChild(b);
  bar.appendChild(el('div','note',`<div style="text-align:right;margin-top:-6px">${p.b!=null?esc(t.blocks[p.b].title)+'<br>':''}<b style="color:var(--paper)">${esc(p.n)}</b>${extra||''}</div>`));
  v.appendChild(bar);
}
function tLearn(v,t){
  const b=t.blocks[testPath(t)[T.p].b];
  tTop(v,t);
  const list=el('div','list');
  if(b.tip) list.appendChild(el('div','item tip',`<div style="font-weight:700;margin-bottom:4px">Главное в этом блоке</div><div>${wrapHz(b.tip)}</div>`));
  b.u.forEach(u=>list.appendChild(unitItem(u)));
  const wl=el('div','item',`<div style="font-weight:700;margin-bottom:6px">Слова блока</div>${b.w.map(w=>`<div class="wl"><span class="han" style="font-size:19px">${wrapHz(w[0])}</span><span class="pyl">${esc(w[1])}</span><span>${esc(w[2])}</span></div>`).join('')}<div class="note">Нажми на иероглиф — ключ, состав и значение.</div>`);
  list.appendChild(wl); v.appendChild(list);
  const ok=el('button','btn','Прочитал, понял — дальше'); ok.style.marginTop='12px'; ok.dataset.key='space'; ok.onclick=()=>tFinish(t); v.appendChild(ok);
}

function tNextBtn(stage,t,ok){ const b=el('button','btn showbtn','Дальше ›'); b.dataset.key='space'; b.onclick=()=>tAnswer(t,ok); stage.appendChild(b); }
function tRun(v,t){
  const x=T.q[0], left=T.q.length;
  tTop(v,t,`<br>осталось: ${left}${T.err?' · ошибок: '+T.err:''}`);
  v.appendChild(el('div','progress',`<i style="width:${(T.total-left)/Math.max(1,T.total)*100}%"></i>`));
  const c=el('div','qcard'); c.style.minHeight='30vh'; v.appendChild(c);
  const stage=el('div',''); v.appendChild(stage);
  const ans=html=>{ c.appendChild(el('div','reveal',html)); };
  const audio=f=>{ c.innerHTML+=`<div class="actionrow" style="justify-content:center;width:100%"><button class="btn mini" data-say="${esc(f.zh)}">▶ Слушать</button><button class="btn mini ghost" data-say="${esc(f.zh)}" data-rate=".5">🐢 Медленно</button></div>
    <button class="linkbtn" id="tTxt">Нет звука? Показать иероглифы</button><div class="han zhl" id="tTx" hidden>${esc(f.zh)}</div>`;
    $('#tTxt').onclick=()=>{ $('#tTx').hidden=!$('#tTx').hidden; };
    if(T.played!==x){ T.played=x; setTimeout(()=>Speech.say(f.zh),150); } };
  if(x.k==='flash'){
    const w=x.w;
    if(x.dir==='zh'){ c.innerHTML=`<div class="qprompt">Что значит?</div><div class="qhz han" style="font-size:68px">${esc(w[0])}</div>`;
      showBtn(stage,()=>{ ans(`<div class="py">${pinyinHTML(w[1])}</div><div class="tr">${esc(w[2])}</div>`); Speech.say(hanOf(w[0]).join('')); tSelf(stage,t); stage.appendChild(el('div','',breakdown(w[0]))); }); }
    else{ c.innerHTML=`<div class="qprompt">Напиши иероглифами</div><div class="qbig">${esc(w[2])}</div><div class="qsub">на бумаге, потом сверь</div>`;
      showBtn(stage,()=>{ ans(`<div class="qhz han" style="font-size:60px">${wrapHz(w[0])}</div><div class="py">${pinyinHTML(w[1])}</div>`); Speech.say(hanOf(w[0]).join('')); tSelf(stage,t); stage.appendChild(el('div','',breakdown(w[0]))); }); }
  }else if(x.k==='tone'){
    const u=x.u, sy=u.sy.split(' ');
    c.innerHTML=`<div class="qprompt">Тоны</div><div class="rul" style="font-size:16px">${esc(u.ru)}</div><button class="say" data-say="${esc(u.zh)}" style="margin-top:8px">▶ Послушать</button>`;
    toneTask(c,hanOf(u.zh),sy,ok=>{ ans(`<div class="pyl" style="font-size:17px">${esc(u.py)}</div><div class="verdict ${ok?'ok':'bad'}">${ok?'Все тоны верны':'Есть ошибки — пример вернётся'}</div>`); tNextBtn(stage,t,ok); });
  }else if(x.k==='tiles'){
    const tl=x.x, pool=shuffle(tl.seg.map((s,i)=>({s,i}))), pick=[];
    c.innerHTML=`<div class="qprompt">Собери фразу по-китайски</div><div class="qbig" style="font-size:19px">${esc(tl.ru)}</div>`;
    const area=el('div','tl area'), rest=el('div','tl'); c.appendChild(area); c.appendChild(rest);
    const chk=el('button','btn showbtn','Проверить'), clr=el('button','btn ghost showbtn','Очистить');
    const draw=()=>{
      area.innerHTML=pick.length?'':'<span class="note" style="margin:0">нажимай на слова ниже</span>';
      pick.forEach((o,j)=>{ const b=el('button','ptile',esc(o.s)); b.onclick=()=>{ pick.splice(j,1); draw(); }; area.appendChild(b); });
      rest.innerHTML=''; pool.filter(o=>!pick.includes(o)).forEach(o=>{ const b=el('button','ptile pool',esc(o.s)); b.onclick=()=>{ pick.push(o); draw(); }; rest.appendChild(b); });
      chk.disabled=pick.length!==tl.seg.length;
    };
    draw();
    const row=el('div','actionrow'); row.appendChild(clr); row.appendChild(chk); stage.appendChild(row);
    clr.onclick=()=>{ pick.length=0; draw(); };
    chk.dataset.key='space';
    chk.onclick=()=>{
      const got=pick.map(o=>o.s).join(''), ok=[tl.seg.join('')].concat(tl.alt||[]).includes(got);
      area.querySelectorAll('button').forEach(b=>b.onclick=null); rest.innerHTML='';
      ans(`<div class="verdict ${ok?'ok':'bad'}">${ok?'Верно':'Неверно. Правильно:'}</div>${ok?'':`<div class="han zhl">${wrapHz(tl.seg.join(''))}</div>`}${(tl.alt||[]).length?`<div class="note">Также верно: ${tl.alt.map(esc).join(', ')}</div>`:''}`);
      row.remove(); tNextBtn(stage,t,ok);
      if(!ok&&x.auto){ const mine=el('button','linkbtn','Мой порядок тоже верный — засчитать'); mine.onclick=()=>tAnswer(t,true); stage.appendChild(mine); }
    };
  }else if(x.k==='hear'){
    c.innerHTML=`<div class="qprompt">Послушай и переведи на русский</div>`; audio(x.f);
    showBtn(stage,()=>{ ans(`<div class="han zhl">${wrapHz(x.f.zh)}</div><div class="pyl">${esc(x.f.py)}</div><div class="tr">${esc(x.f.ru)}</div>`); tSelf(stage,t); });
  }else if(x.k==='write'){
    c.innerHTML=`<div class="qprompt">Напиши по-китайски</div><div class="qbig" style="font-size:20px">${esc(x.f.ru)}</div><div class="qsub">иероглифами на бумаге</div>`;
    showBtn(stage,()=>{ ans(`<div class="han zhl" style="font-size:24px">${wrapHz(x.f.zh)}</div><div class="pyl">${esc(x.f.py)}</div><div class="note">Сверь каждый иероглиф и порядок слов. Хоть одна ошибка — «Ошибся».</div>`); Speech.say(x.f.zh); tSelf(stage,t); });
  }else if(x.k==='dict'){
    c.innerHTML=`<div class="qprompt">Диктант: запиши иероглифами с тонами</div>`; audio(x.f);
    showBtn(stage,()=>{ ans(`<div class="han zhl" style="font-size:24px">${wrapHz(x.f.zh)}</div><div class="pyl">${esc(x.f.py)}</div><div class="rul">${esc(x.f.ru)}</div>`); tSelf(stage,t); });
  }
  c.style.textAlign='center';
  const sm=el('div','note',x.f?esc(x.f.src):''); if(x.f) v.insertBefore(sm,c);
}
function tStepDone(v,t){
  const P=testPath(t), p=P[T.p], tp=tpOf(t.id), n=P.findIndex(q=>!tp.done[q.id]);
  const perfect=T.first&&T.firstOk===T.first;
  let msg='Шаг пройден.';
  if(p.s==='final') msg=perfect?'Всё с первого раза. Ты готов к проверочной.':'Финальная проверка закончена. Пройди её ещё раз, пока всё не будет верно с первого раза.';
  else if(p.s==='exam') msg='Пробная проверочная пройдена.';
  v.appendChild(el('div','empty',`<div class="big han" style="color:${p.s==='final'&&!perfect?'var(--cinnabar)':'var(--jade)'}">${p.s==='final'&&!perfect?'再':'好'}</div>${esc(msg)}${T.first?`<br><span style="font-size:13px">С первого раза верно: ${T.firstOk} из ${T.first}</span>`:''}`));
  if(n>=0){ const b=el('button','btn','Дальше: '+P[n].n+(P[n].b!=null?' · '+t.blocks[P[n].b].title:'')); b.dataset.key='space'; b.onclick=()=>tStart(t,n); v.appendChild(b); }
  if(p.s==='final'){ const b=el('button','btn'+(n<0?'':' ghost'),'Финальная проверка ещё раз'); b.style.marginTop='10px'; b.onclick=()=>tStart(t,P.length-1); v.appendChild(b); }
  const h=el('button','btn ghost','К плану'); h.style.marginTop='10px'; h.onclick=()=>tGo('home'); v.appendChild(h);
}

      res.appendChild(el('p','eyebrow','HSK 3.0 — дополнительно к урокам'));

function stepper(get,set,min,max,step){
  const st=el('div','stepper'), d=el('button','','−'), val=el('b','',get()), i=el('button','','+');
  d.setAttribute('aria-label','меньше'); i.setAttribute('aria-label','больше');
  d.onclick=()=>{ set(Math.max(min,get()-step)); val.textContent=get(); };
  i.onclick=()=>{ set(Math.min(max,get()+step)); val.textContent=get(); };
  st.appendChild(d); st.appendChild(val); st.appendChild(i); return st;
}

  const r1=el('div','setrow'); r1.innerHTML='<div class="lab"><b>Урок группы</b><small>Где сейчас группа. «Урок дня» догоняет до него, потом идёт дальше</small></div>';
  r1.appendChild(stepper(()=>State.settings.lesson,x=>{ State.settings.lesson=x; save('settings'); $('#topSub').textContent='Кондрашевский · урок группы '+x; },1,NL,1)); box.appendChild(r1);
  const r2=el('div','setrow'); r2.innerHTML=`<div class="lab"><b>Новых слов в день</b><small>Сегодня введено: ${State.meta.newToday||0}. Ключи — до ${RAD_PER_DAY} в день сверх этого</small></div>`;
  r2.appendChild(stepper(()=>State.settings.newPerDay,x=>{ State.settings.newPerDay=x; save('settings'); },0,40,2)); box.appendChild(r2);
  const voices=Speech.list();
  const r3=el('div','setrow'); r3.innerHTML=`<div class="lab"><b>Голос</b><small>${esc(Speech.source())}</small></div>`;
  if(voices.length>1){
    const sel=el('select'); sel.appendChild(el('option','','Авто')).value='';
    voices.forEach(vo=>{ const o=el('option','',esc(vo.name+' ('+vo.lang+')')); o.value=vo.name; if(State.settings.voiceName===vo.name) o.selected=true; sel.appendChild(o); });
    sel.onchange=()=>{ State.settings.voiceName=sel.value||null; Speech.setPref(State.settings.voiceName); save('settings'); Speech.say('你好'); };
    r3.appendChild(sel);
  }else{ const t=el('button','btn mini ghost','🔊 Проверить'); t.onclick=()=>{ Speech.say('你好'); toast(Speech.voice()?'🔊 '+Speech.voice().name:'Китайский голос не найден'); }; r3.appendChild(t); }
  box.appendChild(r3);
  v.appendChild(box);
  const box2=el('div','meta');
  const rs=el('div','setrow'); rs.innerHTML='<div class="lab"><b>Сбросить прогресс</b><small>Удалить все повторения, ключи и подготовку к проверочным</small></div>';
  let armed=false; const rb=el('button','btn mini ghost','Сброс');
  rb.onclick=async()=>{ if(!armed){ armed=true; rb.textContent='Точно? Ещё раз'; rb.style.color='var(--bad)'; setTimeout(()=>{ armed=false; rb.textContent='Сброс'; rb.style.color=''; },4000); return; }
    State.cards={}; State.meta={day:todayStr(),newToday:0,radToday:0,rev:{}}; State.tp={}; SESSION=null; T=null; await save(); toast('Прогресс сброшен'); go('home'); };
  rs.appendChild(rb); box2.appendChild(rs); v.appendChild(box2);
  const learned=Object.keys(State.cards).filter(k=>validKey(k)&&!isNew(k));
  v.appendChild(el('p','note',`В работе: ${learned.filter(k=>!isRad(k)).length} слов, ${learned.filter(isRad).length} ключей · всего повторений: ${Object.values(State.meta.rev||{}).reduce((a,b)=>a+b,0)}.<br>
    Хранилище: ${Store.persistent()?'на устройстве (IndexedDB) — прогресс у каждого браузера свой':'в памяти (превью)'}.<br>
    Данные: Кондрашевский, том 1 (30 уроков, ${COURSE.filter(k=>!isRad(k)).length} слов) + HSK 1–6. Разбор иероглифов — makemeahanzi и Unihan (номер ключа по Канси), названия ключей — таблица ДВФУ. Интервалы — FSRS-5.`));
  s.appendChild(v);
}

  await loadState();
  Speech.setPref(State.settings.voiceName);
  window.HZDATA=null;
  fetch('./hanzi-data.json').then(r=>r.ok?r.json():null).then(d=>{ window.HZDATA=d||{}; }).catch(()=>{ window.HZDATA={}; });
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('./service-worker.js'); }catch(e){} }
  go('home');
})();
</script>
