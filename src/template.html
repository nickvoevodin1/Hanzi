<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9600">
<meta name="mobile-web-app-capable" content="yes">
<title>朱 · Тренажёр иероглифов</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.7.3/hanzi-writer.min.js"></script>
<style>
/* ===== Оформление: палитра Duolingo (белый, серые Swan/Wolf/Eel), их зелёный акцент заменён оранжевым =====
   Оранжевый (#ff9600, «Fox» из палитры Duolingo) — кнопки и активные элементы; зелёный — только «верно»; красный — «ошибка».
   Шрифт Nunito (OFL) — локально из ./fonts, чтобы приложение выглядело одинаково и без интернета. */
@font-face{font-family:Nunito;font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/nunito-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/nunito-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Nunito;font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/nunito-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Nunito;font-style:normal;font-weight:800;font-display:swap;src:url(./fonts/nunito-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-style:normal;font-weight:800;font-display:swap;src:url(./fonts/nunito-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Nunito;font-style:normal;font-weight:800;font-display:swap;src:url(./fonts/nunito-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Nunito;font-style:normal;font-weight:900;font-display:swap;src:url(./fonts/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-style:normal;font-weight:900;font-display:swap;src:url(./fonts/nunito-latin-ext-900-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Nunito;font-style:normal;font-weight:900;font-display:swap;src:url(./fonts/nunito-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#ffffff; --bg2:#f7f7f7; --card:#ffffff; --line:#e5e5e5; --line2:#d7d7d7;
  --text:#4b4b4b; --title:#3c3c3c; --text2:#777777; --text3:#afafaf;
  --primary:#ff9600; --primary-lip:#e07b00; --primary-soft:#fff3e0; --primary-text:#d26c00; --primary-line:#ffd29a;
  --ok:#58cc02; --ok-lip:#58a700; --ok-soft:#d7ffb8; --ok-text:#58a700;
  --bad:#ff4b4b; --bad-lip:#ea2b2b; --bad-soft:#ffdfe0; --bad-text:#ea2b2b;
  --blue:#1cb0f6; --blue-lip:#1899d6; --blue-soft:#ddf4ff;
  --gold:#ffc800; --gold-lip:#e5a000; --gold-soft:#fff5d3;
  --fire:#ff9600; --ice:#84d8ff; --purple:#ce82ff; --purple-lip:#a568cc;
  --seal:#ff9600;
  --t1:#e8432f; --t2:#e59400; --t3:#3a9d23; --t4:#1899d6; --t5:#9a9a9a;
  --r:16px; --rs:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  /* старые имена (экраны уроков, проверочных, ключей) */
  --ink:var(--bg2); --surface:var(--card); --surface-2:var(--bg2); --ink3:#f0f0f0;
  --paper:var(--title); --paper-dim:var(--text2); --muted:var(--text3);
  --cinnabar:var(--primary); --cinnabar-2:var(--primary-text); --cinnabar-ink:var(--primary-soft);
  --jade:var(--ok-lip); --indigo:var(--blue-lip);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Nunito,"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:700;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
.han,.hz{font-family:"Songti SC","Noto Serif SC","STSong","SimSun",serif;font-weight:400}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:inherit;font-weight:inherit}
input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + var(--safe-b))}
body.focus #app{padding-bottom:calc(150px + var(--safe-b))}
.view{padding:12px 16px 8px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Верхняя панель: печать, тип дня, серия, заморозки, кольцо XP */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:2px solid var(--line)}
body.focus .top{display:none}
.seal{width:44px;height:36px;display:grid;place-items:center;flex:none;padding:0}
.seal .mascot{display:block}
.daychip{font-size:12px;font-weight:800;color:var(--text2);border:2px solid var(--line);border-radius:12px;padding:4px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;background:var(--bg2)}
.daychip.away,.daychip.holiday{color:var(--blue-lip);border-color:#b9e6fb;background:var(--blue-soft)}
.daychip.focus{color:var(--purple-lip);border-color:#ecd0ff;background:#f9efff}
.daychip.consol{color:var(--gold-lip);border-color:#ffe28a;background:var(--gold-soft)}
.top .spacer{flex:1}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px;color:var(--text3);flex:none;padding:0}
.stat.fire{color:var(--fire)} .stat.ice{color:#49c0f8}
.stat.off{color:var(--text3)}
.stat svg{display:block}
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:900;color:var(--text2)}
.ring.full b{color:var(--gold-lip)}

/* Кнопки — «3D» с нижней кромкой */
.btn{display:block;width:100%;text-align:center;background:var(--primary);color:#fff;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:14px 16px;border-radius:var(--rs);font-size:15px;box-shadow:0 4px 0 var(--primary-lip);transition:transform .08s,box-shadow .08s;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--primary-lip)}
.btn.ghost{background:var(--card);color:var(--blue-lip);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-lip)}
.btn.badc{background:var(--bad);box-shadow:0 4px 0 var(--bad-lip)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-lip)}
.btn.gold{background:var(--gold);color:#6b4b00;box-shadow:0 4px 0 var(--gold-lip)}
.btn.mini{display:inline-block;width:auto;padding:9px 14px;font-size:12.5px;border-radius:12px}
.btn[disabled]{background:var(--line);color:var(--text3);box-shadow:0 4px 0 var(--line2);pointer-events:none}
.actionrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.actionrow .btn{flex:1;margin:0}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);
  display:grid;place-items:center;font-size:18px;color:var(--text2);flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
.iconbtn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 3px 0 var(--blue-lip)}
.back{font-size:14px;color:var(--text3);display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-weight:800;padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
.linkbtn{color:var(--blue-lip);font-size:13px;margin-top:10px;font-weight:800}
h2.title{margin:2px 0 4px;font-size:22px;font-weight:900;color:var(--title)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:20px 0 8px;font-weight:900}
.note{font-size:13px;color:var(--text2);line-height:1.5;margin-top:10px;font-weight:600}
.empty{text-align:center;color:var(--text2);padding:30px 16px;font-size:15px}
.empty .big{font-size:48px;margin-bottom:10px;color:var(--ok)}

/* Карточки-блоки */
.hero,.box{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.hero h2{margin:0 0 4px;font-size:18px;font-weight:900;color:var(--title)}
.hero p{margin:0 0 12px;color:var(--text2);font-size:13.5px;line-height:1.45;font-weight:600}
.hero + .hero{margin-top:12px}
.kind{font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-text)}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .4s cubic-bezier(.2,.8,.2,1);position:relative}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:3px;background:rgba(255,255,255,.3)}
.bar.ok>i{background:var(--ok)} .bar.gold>i{background:var(--gold)} .bar.blue>i{background:var(--blue)}
.bar>u{position:absolute;top:0;bottom:0;left:0;background:var(--ok);opacity:.85;border-radius:8px}
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;border:2px solid var(--line);color:var(--text2);font-weight:800}
.pill.k{color:var(--primary-text);border-color:var(--primary-line);background:var(--primary-soft)}
.pill.hsk{color:var(--gold-lip);border-color:#ffe28a}
.pill.ok{color:var(--ok-lip);border-color:#b8f28b}
.pill.blue{color:var(--blue-lip);border-color:#b9e6fb;background:var(--blue-soft)}
.pill.bad{color:var(--bad-text);border-color:#ffc1c1;background:var(--bad-soft)}

/* Семестр, задания дня */
.sem .row2{display:flex;gap:10px;margin-top:12px}
.sem .cell{flex:1;text-align:center;border:2px solid var(--line);border-radius:12px;padding:8px 4px}
.sem .cell b{display:block;font-size:20px;font-weight:900;color:var(--title);line-height:1.15}
.sem .cell span{font-size:11px;color:var(--text3);font-weight:800}
.warn{margin-top:10px;font-size:13px;color:var(--primary-text);background:var(--primary-soft);border:2px solid var(--primary-line);border-radius:12px;padding:8px 10px;font-weight:800}
.info{margin-top:10px;font-size:13px;color:var(--blue-lip);background:var(--blue-soft);border-radius:12px;padding:8px 10px;font-weight:800}
/* иконки внутри текста и кнопок */
.ico{flex:none}
.btn .ico,.say .ico,.linkbtn .ico,.back .ico,.tag .ico,.info .ico,.warn .ico,.note .ico,.kind .ico,.newtag .ico,.star .ico,.chip .ico,.tab .ico{vertical-align:-4px}
.btn .ico{margin-right:2px}
.quest{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line);width:100%;text-align:left}
.quest:last-of-type{border-bottom:none}
.quest .qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--bg2);flex:none;border:2px solid var(--line)}
.quest .qm{flex:1;min-width:0}
.quest .qm b{display:block;font-size:14.5px;color:var(--title);font-weight:800}
.quest .qm small{display:block;color:var(--text3);font-size:12px;font-weight:700;margin:1px 0 5px}
.quest .bar{height:12px}
.quest.done .qi{background:var(--ok-soft);border-color:#b8f28b}
.quest .star{color:var(--gold-lip);font-size:12px;font-weight:900}
.quest .chev{color:var(--text3);font-size:20px;display:grid}

/* Путь (как у Duolingo: баннер юнита, узлы-«таблетки» с кромкой, кольцо прогресса у текущего, подсказка по тапу) */
.section{margin:26px 0 4px;text-align:center;display:flex;align-items:center;gap:12px}
.section::before,.section::after{content:"";flex:1;height:2px;background:var(--line)}
.section h3{margin:0;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.ubanner{border-radius:var(--r);padding:14px 14px 14px 18px;color:#fff;display:flex;align-items:center;gap:12px;margin:18px 0 10px;box-shadow:0 4px 0 rgba(0,0,0,.18);text-align:left;width:100%}
.ubanner .ut{flex:1;min-width:0}
.ubanner small{display:block;font-size:12.5px;opacity:.92;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.ubanner b{display:block;font-size:18px;font-weight:900;line-height:1.25;margin-top:1px}
.ubanner b.han{font-size:21px;letter-spacing:2px}
.ubanner .crowns{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:6px 6px 4px;border-radius:12px;border:2px solid rgba(255,255,255,.4);flex:none}
.ubanner .crowns b{font-size:15px;margin:0;line-height:1}
.ubanner .crowns small{font-size:11px;letter-spacing:0;text-transform:none;opacity:.95;margin-top:1px}
.ubanner.locked{background:var(--bg2)!important;color:var(--text3);box-shadow:0 4px 0 var(--line)!important;border:2px solid var(--line)}
.ubanner.locked .crowns{border-color:var(--line);color:var(--text3)}
.ubanner.donegrp{background:var(--gold);box-shadow:0 4px 0 var(--gold-lip);color:#7a5200}
.ubanner.donegrp .crowns{border-color:rgba(122,82,0,.25)}
.ubanner .tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);color:var(--title);border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:900;margin:6px 6px 0 0;text-transform:none;letter-spacing:0}
.ujump{display:block;margin:2px auto 8px;color:var(--blue-lip);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:14px 0 18px}
.pnode{--nc:var(--primary);--nl:var(--primary-lip);position:relative;display:flex;flex-direction:column;align-items:center;width:100px}
.pnode button.disc{position:relative;z-index:2;width:72px;height:64px;border-radius:50%;background:var(--nc);color:#fff;font-size:30px;display:grid;place-items:center;
  box-shadow:0 8px 0 var(--nl);transition:transform .08s,box-shadow .08s}
.pnode button.disc::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:9px;border-radius:9px;background:rgba(255,255,255,.28)}
.pnode button.disc:active{transform:translateY(8px);box-shadow:0 0 0 var(--nl)}
.pnode button.disc .han{font-size:31px;line-height:1}
.pnode button.disc svg{position:relative}
.pnode.locked button.disc{background:var(--line);color:var(--text3);box-shadow:0 8px 0 var(--line2)}
.pnode.locked button.disc::before{background:rgba(255,255,255,.5)}
.pnode.locked button.disc .han{color:var(--text3)}
.pnode .nbadge{position:absolute;z-index:3;top:-8px;right:4px;width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 0 var(--line)}
.pnode .lab{font-size:12.5px;color:var(--text2);font-weight:800;max-width:220px;text-align:center;line-height:1.3;margin-top:14px}
.pnode.boss{width:auto}
.pnode.boss button.disc{width:92px;height:80px;border-radius:26px;background:var(--purple);box-shadow:0 8px 0 var(--purple-lip)}
.pnode.boss.done button.disc{background:var(--gold);box-shadow:0 8px 0 var(--gold-lip)}
/* текущий узел: кольцо прогресса строго вокруг «лица» узла (центр — в центре круга, кромка не сдвигает), «Начать» сверху */
.pnode.cur{margin-top:56px}
.pnode .nring{position:absolute;z-index:1;width:100px;height:100px;left:0;top:-18px;pointer-events:none}
.startbubble{position:absolute;z-index:4;bottom:calc(100% + 26px);left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);
  color:var(--nc);font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:12px;white-space:nowrap;
  animation:bob 1.6s ease-in-out infinite}
.startbubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--line)}
.startbubble::before{content:"";position:absolute;top:calc(100% - 3px);left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;z-index:1}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.pmascot{position:absolute;top:-6px;pointer-events:none}
.pmascot.l{right:calc(100% + 18px)} .pmascot.r{left:calc(100% + 18px)}
/* подсказка узла */
.npop{--ax:0px;--lip:var(--primary-lip);position:relative;width:min(100%,300px);margin:-6px 0 2px;background:var(--primary);color:#fff;border-radius:16px;padding:14px 16px 16px;text-align:left;
  box-shadow:0 4px 0 var(--lip);animation:pop2 .18s ease-out}
.npop::before{content:"";position:absolute;bottom:100%;left:calc(50% + var(--ax));margin-left:-10px;border:10px solid transparent;border-bottom-color:var(--npbg,var(--primary))}
.npop b{display:block;font-size:17px;font-weight:900}
.npop small{display:block;font-size:13.5px;font-weight:800;opacity:.92;margin:2px 0 12px;line-height:1.35}
.npop .popbtn{display:block;width:100%;background:#fff;border-radius:14px;padding:12px;font-size:14.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.npop .popbtn:active{transform:translateY(4px);box-shadow:none}
.npop.locked{--npbg:var(--line);background:var(--bg2);color:var(--text2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.npop.locked small{margin-bottom:0}
@keyframes pop2{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.unitmeta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:-2px 0 4px}

/* Урок-игра */
.playtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.playtop .x{font-size:24px;color:var(--text3);width:32px;flex:none;line-height:1;display:grid;place-items:center}
.playtop .bar{flex:1;height:16px}
.combo{font-weight:900;color:var(--text3);font-size:16px;min-width:44px;flex:none;transition:color .2s;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.combo.hot{color:var(--fire)}
.qh{font-size:22px;font-weight:900;color:var(--title);margin:4px 0 14px;line-height:1.25}
.qhz{font-size:92px;line-height:1.05;letter-spacing:2px;color:var(--title)}
.qcard{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:22px 16px;text-align:center;min-height:30vh;position:relative;overflow:hidden}
.qsub{font-size:15px;color:var(--text2);margin-top:12px;font-weight:700}
.qprompt{font-size:13px;color:var(--text3);margin-bottom:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.qbig{font-size:24px;font-weight:900;line-height:1.3;color:var(--title)}
.reveal{margin-top:14px;border-top:2px dashed var(--line);padding-top:14px;width:100%}
.reveal .py{font-size:20px}.reveal .tr{font-size:17px;margin-top:4px;font-weight:800;color:var(--title)}
.reveal .en{font-size:13px;color:var(--text2);margin-top:6px}
.verdict{font-weight:900;margin-top:8px}.verdict.ok{color:var(--ok-text)}.verdict.bad{color:var(--bad-text)}
.choices{display:grid;gap:10px;margin-top:14px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{padding:15px 12px;border-radius:var(--rs);background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:17px;text-align:center;
  color:var(--title);transition:transform .08s;line-height:1.3}
.choice:active{transform:translateY(2px)}
.choice.sel{border-color:#84d8ff;background:var(--blue-soft);box-shadow:0 4px 0 #84d8ff;color:var(--blue-lip)}
.choice.correct{border-color:#a5ed6e;background:var(--ok-soft);box-shadow:0 4px 0 #a5ed6e;color:var(--ok-text)}
.choice.wrong{border-color:#ffb2b2;background:var(--bad-soft);box-shadow:0 4px 0 #ffb2b2;color:var(--bad-text)}
.choice.dim{opacity:.45}
.choice .num{float:left;font-size:12px;color:var(--text3);border:2px solid var(--line);border-radius:8px;width:24px;height:24px;display:grid;place-items:center;margin-top:-1px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pairs .choice{min-height:58px;display:grid;place-items:center;padding:8px;font-size:15px}
.pairs .choice.han{font-size:26px}
.pairs .choice.gone{animation:pop .35s forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(.85);opacity:.12}}
.tinput,textarea.tinput{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:var(--rs);padding:14px;color:var(--title);font-size:18px;text-align:center;margin-top:12px;font-weight:700}
textarea.tinput{text-align:left;font-size:15px;min-height:140px}
.tinput:focus{outline:none;border-color:var(--blue)}
.tones{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.trow{display:flex;align-items:center;gap:8px}
.trow .han{font-size:30px;width:44px;text-align:center;color:var(--title)}
.trow .seg{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.trow .seg button{border:2px solid var(--line);border-radius:12px;padding:6px 0 4px;font-size:20px;box-shadow:0 3px 0 var(--line);background:var(--card);color:var(--title);line-height:1;display:flex;flex-direction:column;align-items:center}
.trow .seg button small{display:block;font-size:10.5px;color:var(--text3);margin-top:1px;font-weight:900}
.trow .seg button.on{border-color:#84d8ff;background:var(--blue-soft);box-shadow:0 3px 0 #84d8ff;color:var(--blue-lip)}
.trow .seg button.right{border-color:#a5ed6e;background:var(--ok-soft);color:var(--ok-text)}
.trow .seg button.wrongs{border-color:#ffb2b2;background:var(--bad-soft);color:var(--bad-text)}
.trow.fix{opacity:.5}
.tl{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;margin-top:10px;justify-content:center}
.tl.area{border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 4px;align-items:center;justify-content:flex-start;min-height:64px}
.ptile{font-size:20px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);color:var(--title);font-weight:700}
.ptile.han{font-size:24px}
.ptile.pool{}
.ptile.used{visibility:hidden}
.ptile.sel{border-color:#84d8ff;background:var(--blue-soft);color:var(--blue-lip);box-shadow:0 3px 0 #84d8ff}
.ptile.right{border-color:#a5ed6e;background:var(--ok-soft);color:var(--ok-text)}
.ptile.wrongs{border-color:#ffb2b2;background:var(--bad-soft);color:var(--bad-text)}
.showbtn{margin-top:14px}
.gradebar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.gradebar.four{grid-template-columns:repeat(4,1fr);gap:7px}
.grade{padding:13px 4px;border-radius:var(--rs);text-align:center;font-weight:900;font-size:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);color:var(--title)}
.grade small{display:block;font-size:10.5px;color:var(--text3);font-weight:800;margin-top:2px}
.grade.g1{color:var(--bad-text);border-color:#ffc1c1;box-shadow:0 4px 0 #ffc1c1}
.grade.g2{color:var(--gold-lip);border-color:#ffe28a;box-shadow:0 4px 0 #ffe28a}
.grade.g3{color:#fff;background:var(--ok);border-color:var(--ok);box-shadow:0 4px 0 var(--ok-lip)}
.grade.g3 small{color:rgba(255,255,255,.85)}
.grade.g4{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 4px 0 var(--blue-lip)}
.grade.g4 small{color:rgba(255,255,255,.85)}
.grade.half{color:var(--gold-lip);border-color:#ffe28a;box-shadow:0 4px 0 #ffe28a}
#writer,.writer{width:250px;height:250px;margin:6px auto;background:var(--bg2);border:2px solid var(--line);border-radius:var(--r);touch-action:none;
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),var(--line) calc(50% - 1px),var(--line) calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(transparent calc(50% - 1px),var(--line) calc(50% - 1px),var(--line) calc(50% + 1px),transparent calc(50% + 1px))}
.drawhint{font-size:13px;color:var(--text2);text-align:center;margin-top:8px;min-height:18px}
.introcard{text-align:center}
.newtag{display:inline-block;color:var(--purple-lip);background:#f9efff;border-radius:10px;padding:3px 10px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.palla{font-size:13px;color:var(--text3);margin-top:2px}
.mascotrow{display:flex;align-items:flex-end;gap:10px;margin:2px 0 12px}
.say-bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 12px;font-size:14px;color:var(--title);font-weight:800;line-height:1.3}
.say-bubble::before{content:"";position:absolute;left:-9px;bottom:14px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.mascot{flex:none;display:block}
.mascot.m-happy,.mascot.m-cheer{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10px) scale(1.04,.96)}100%{transform:none}}
.mascot.m-sleep .zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* Нижняя панель ответа */
/* нижняя панель действия в уроке (как у Duolingo) */
.playfoot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:2px solid var(--line);padding:14px 16px calc(14px + var(--safe-b))}
.playfoot .in{max-width:600px;margin:0 auto}
.playfoot .btn,.playfoot .showbtn,.playfoot .actionrow{margin:0}
.playfoot:has(.in:empty){display:none}
.kind.retry{color:var(--bad-text);display:flex;align-items:center;gap:6px}
.bigsay{width:96px!important;height:96px!important;border-radius:26px!important;margin:4px auto 0;box-shadow:0 5px 0 var(--blue-lip)!important}
.tonechoice{display:flex;flex-direction:column;align-items:center;gap:2px}
.tonechoice b{font-size:18px;line-height:1}
.tonechoice small{font-size:11.5px;color:var(--text2);font-weight:800;line-height:1.2}
.choice.correct .tonechoice small,.choice.wrong .tonechoice small{color:inherit}
.cmprow .say{display:inline-flex;align-items:center;gap:4px;font-size:15px}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:16px 16px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,1.25,.4,1)}
.fb.on{transform:none}
.fb .in{max-width:600px;margin:0 auto}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb h3{margin:0 0 6px;font-size:21px;font-weight:900;display:flex;align-items:center;gap:10px}
.fb.ok h3{color:var(--ok-text)} .fb.bad h3{color:var(--bad-text)}
.fb .ans{font-size:15px;line-height:1.4;margin-bottom:12px;color:var(--bad-text);font-weight:800}
.fb.ok .ans{color:var(--ok-text)}
.fb .ans .han{font-size:22px}
.fb .ic{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.fb .btn{margin-top:4px}
.fb.ok .btn{background:var(--ok);box-shadow:0 4px 0 var(--ok-lip)}
.fb.bad .btn{background:var(--bad);box-shadow:0 4px 0 var(--bad-lip)}
.fb .linkbtn{display:block;margin:10px auto 0;color:var(--text2)}
.fb .fbextra{margin:-2px 0 12px}
.fb .cheer{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-size:13px;color:var(--text2);font-weight:800}
.combopop{position:fixed;left:50%;top:22%;z-index:65;transform:translate(-50%,0) scale(.4);opacity:0;pointer-events:none;display:flex;align-items:center;gap:4px;white-space:nowrap;
  background:var(--fire);color:#fff;font-weight:900;font-size:24px;padding:10px 20px;border-radius:18px;box-shadow:0 5px 0 #d97f00}
.combopop.on{animation:combo 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}25%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1;transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(.9)}}
.achpop{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:70;transform:translate(-50%,calc(-100% - 60px));visibility:hidden;transition:transform .45s cubic-bezier(.2,1.3,.4,1),visibility 0s .45s;
  background:var(--card);border:2px solid var(--gold);box-shadow:0 5px 0 var(--gold-lip);border-radius:18px;padding:10px 16px;display:flex;align-items:center;gap:12px;width:max-content;max-width:92%}
.achpop div{min-width:0}
.achpop.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s cubic-bezier(.2,1.3,.4,1),visibility 0s}
.achpop .ai{font-size:30px;display:grid}
.achpop b{display:block;color:var(--title);font-size:15px}
.achpop small{color:var(--text2);font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

/* Итог урока */
.endwrap{text-align:center;padding-top:22px}
.endwrap .mascot{margin:0 auto}
.endwrap .btn{margin-top:18px}
.endwrap h2{font-size:26px;font-weight:900;color:var(--gold-lip);margin:12px 0 4px}
.endstats{display:flex;gap:10px;margin:18px 0 8px}
.estat{flex:1;border-radius:16px;border:2px solid var(--gold);overflow:hidden}
.estat small{display:block;background:var(--gold);color:#fff;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 2px}
.estat b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:22px;font-weight:900;padding:12px 2px;color:var(--gold-lip)}
.estat.acc{border-color:var(--ok)} .estat.acc small{background:var(--ok)} .estat.acc b{color:var(--ok-text)}
.estat.time{border-color:var(--blue)} .estat.time small{background:var(--blue)} .estat.time b{color:var(--blue-lip)}

/* Прогресс */
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stbox{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.stbox .si{font-size:22px;display:grid}
.stbox b{display:block;font-size:19px;font-weight:900;color:var(--title);line-height:1.1}
.stbox small{color:var(--text3);font-size:12px;font-weight:800}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--line);display:block}
.heat i.l1{background:#ffd8c7}.heat i.l2{background:#ffa47e}.heat i.l3{background:var(--primary)}.heat i.l4{background:var(--primary-lip)}
.heat i.fz{background:var(--ice)} .heat i.fut{background:transparent}
.heat i.today{outline:2px solid var(--title);outline-offset:-1px}
.wbars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.wbars .wb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.wbars .wb i{display:block;width:100%;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:2px}
.wbars .wb.cur i{background:var(--fire)}
.wbars .wb small{font-size:10px;color:var(--text3);font-weight:800;white-space:nowrap}
.wbars .wb em{font-style:normal;font-size:10px;color:var(--text2);font-weight:800}
.states{display:flex;height:22px;border-radius:10px;overflow:hidden;background:var(--line);margin-top:8px}
.states i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--text2);font-weight:800}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}
.crowngrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.crowngrid div{border:2px solid var(--line);border-radius:10px;text-align:center;padding:5px 0;font-size:11px;color:var(--text3);font-weight:900}
.crowngrid div b{display:block;font-size:15px;color:var(--gold-lip)}
.crowngrid div.c0 b{color:var(--text3)}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.ach .ai{font-size:30px;filter:grayscale(1);opacity:.4;display:grid;place-items:center;height:44px}
.ach b{display:block;font-size:12.5px;color:var(--text3);line-height:1.2;margin-top:4px}
.ach small{display:block;font-size:10.5px;color:var(--text3);font-weight:700;margin-top:2px}
.ach.got{border-color:var(--gold);background:var(--gold-soft)}
.ach.got .ai{filter:none;opacity:1}
.ach.got b{color:var(--title)}
.chest{display:flex;align-items:center;gap:12px}
.chest .cico{font-size:40px;transition:transform .3s;display:grid}
.chest.open .cico{animation:chest 1s ease}
@keyframes chest{0%{transform:scale(1) rotate(0)}20%{transform:scale(1.2) rotate(-12deg)}40%{transform:scale(1.2) rotate(12deg)}60%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}

/* Списки (уроки, слова, словарь) */
.rowlist{border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:2px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:active{background:var(--bg2)}
.row .n{width:34px;height:34px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-size:13px;color:var(--text2);border:2px solid var(--line);flex:none;font-weight:900}
.row.cur .n{background:var(--primary);color:#fff;border-color:var(--primary)}
.row .tt{flex:1;min-width:0}
.row .tt b{font-size:15px;font-weight:800;display:block;color:var(--title)}
.row .tt small{color:var(--text3);font-size:12px;font-weight:700}
.row .cnt{font-size:12px;color:var(--gold-lip);border:2px solid var(--line);border-radius:20px;padding:2px 9px;flex:none;font-weight:900}
.row .chev{color:var(--text3);font-size:20px;flex:none;display:grid}
.row .ri{font-size:24px;width:40px;height:40px;text-align:center;flex:none;display:grid;place-items:center}
.tabs{display:flex;gap:8px;margin:10px 0 12px}
.tab{flex:1;padding:9px 6px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:13px;color:var(--text2);text-align:center;font-weight:800;box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--blue-soft);border-color:#84d8ff;color:var(--blue-lip);box-shadow:0 3px 0 #84d8ff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:var(--card);color:var(--text2);font-size:13px;font-weight:800;padding:6px 12px;border-radius:99px}
.chip.on{background:var(--blue-soft);border-color:#84d8ff;color:var(--blue-lip)}
.search{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:var(--rs);padding:13px 14px;color:var(--title);font-size:16px;margin-bottom:12px;font-weight:700}
.search:focus{outline:none;border-color:var(--blue)}
.witem{display:flex;align-items:center;gap:13px;padding:11px 14px;border-bottom:2px solid var(--line);width:100%;text-align:left}
.witem:last-child{border-bottom:none}
.witem:active{background:var(--bg2)}
.witem .hzw{font-size:26px;line-height:1;min-width:36px;color:var(--title)}
.witem .mid{flex:1;min-width:0}
.witem .py{font-size:14px}
.witem .tr{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.st{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.st.seen{background:var(--blue)} .st.due{background:var(--gold)} .st.known{background:var(--ok)}

/* Карточка слова */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:22px 18px 20px;text-align:center;position:relative;overflow:hidden}
.bighz{font-size:92px;line-height:1.05;margin:4px 0 8px;letter-spacing:2px;color:var(--title)}
.bigpy{font-size:22px;margin-bottom:6px}
.bigtr{font-size:17px;margin-bottom:2px;font-weight:800;color:var(--title)}
.bigen{font-size:13px;color:var(--text3);margin-top:4px}
.tagrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.cardbtns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.cardbtns .iconbtn{width:50px;height:50px;font-size:20px}
.meta{margin-top:14px;border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.mr{display:flex;padding:12px 14px;border-bottom:2px solid var(--line);font-size:14px;gap:12px;text-align:left;font-weight:600}
.mr:last-child{border-bottom:none}
.mr .k{color:var(--text3);width:104px;flex:none;font-weight:800}
.mr .v{flex:1;min-width:0}

/* Разбор иероглифа, разбор на ключи */
.bks{display:flex;flex-direction:column;gap:8px;margin-top:10px;text-align:left}
.bk{border:2px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;font-size:14px;background:var(--card);line-height:1.45;font-weight:600}
.bkh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bkh .han{font-size:34px;line-height:1.1;color:var(--title)}
.bk b.han{font-size:19px}
.bk .lbl,.lbl{color:var(--text3);font-size:12.5px;font-weight:700}
.hz{cursor:pointer;border-radius:4px;border-bottom:2px dotted var(--primary-line)}
.hz:hover{background:var(--primary-soft)}
.dec{border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;margin-top:10px;font-weight:700;line-height:1.5}
.dec .dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dec .dh .han{font-size:40px;color:var(--title);line-height:1.1}
.dec .dh b{font-size:19px}
.dec .dk{margin-top:6px;font-size:15px;color:var(--title)}
.dec .dk .han{font-size:22px}
.ds{margin-top:4px;font-size:13px;color:var(--text2)}
.ds.dkey{margin-top:6px;font-size:14px;color:var(--title);font-weight:650}
.tline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.tpill{display:inline-block;font-size:12px;font-weight:900;border-radius:10px;padding:3px 10px;color:#fff;letter-spacing:.02em}
.tpill.g{background:var(--blue)} .tpill.z,.tpill.i{background:var(--purple)} .tpill.p{background:var(--primary)}
.dparts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dp{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13.5px;line-height:1.35}
.dp .han{font-size:28px;min-width:34px;text-align:center;color:var(--title)}
.dp.s,.dp.m{border-color:var(--primary-line);background:var(--primary-soft)}
.dp.f{border-color:#b9e6fb;background:var(--blue-soft)}
.dp.x{border-style:dashed;color:var(--text2)}
.disp{color:var(--gold-lip);font-weight:900}
.kchip{display:inline-flex;align-items:baseline;gap:4px;border:2px solid var(--line);border-radius:10px;padding:2px 8px;margin:3px 4px 3px 0;background:var(--bg2)}
.kchip .han{font-size:22px;color:var(--title)}
.kchip small{font-size:12px;color:var(--text2);font-weight:800}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheetc{background:var(--bg);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--safe-b));max-height:86vh;overflow:auto;animation:up .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
details.strk{margin-top:2px}
details.strk summary{cursor:pointer;color:var(--text2);font-size:13px;font-weight:800}
details.strk ol{margin:6px 0 0;padding-left:22px;font-size:13px;line-height:1.75}
details.strk .sti{vertical-align:middle;margin-right:6px;opacity:.85}
.evo{margin-top:6px}
.evo img{width:100%;height:auto;border:2px solid var(--line);border-radius:10px;background:#fff;display:block}
.evocap{display:grid;grid-template-columns:repeat(8,1fr);font-size:9.5px;color:var(--text3);text-align:center;line-height:1.2;margin-top:3px}
.strow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid var(--line)}
.strow:last-child{border-bottom:none}
.strow .sti{height:34px;width:46px;object-fit:contain;flex:none}
.strow .num{width:26px;color:var(--text3);font-weight:900;font-size:12px;flex:none}
.strow .nm{flex:1;font-size:14px}
.strow .ex{font-size:20px;letter-spacing:4px}

/* Старые экраны: сессия-карточки, проверочные */
.qwrap{display:flex;flex-direction:column}
.progress{height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .3s}
.tn{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.tc{display:flex;flex-direction:column;align-items:center;min-width:48px;padding:6px 4px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.tc .han{font-size:24px;line-height:1.2}
.tc .tm{font-size:20px;line-height:1;color:var(--primary);min-height:24px;font-weight:900;display:grid;place-items:center}
.tc .tp{font-size:12px;color:var(--text3)}
.tc.fix{opacity:.55}
.tc.ok{border-color:#a5ed6e;background:var(--ok-soft)}
.tc.bad{border-color:#ffb2b2;background:var(--bad-soft)}
.item{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;display:block}
button.item{box-shadow:0 3px 0 var(--line)}
.list{display:flex;flex-direction:column;gap:10px}
.sdots{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.sdot{border:2px solid var(--line);background:var(--card);color:var(--text2);font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px}
.sdot.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sdot.cur{border-color:var(--primary);color:var(--primary-text)}
.rowbtn{font-weight:900;font-size:14.5px}.rowbtn.ok{color:var(--ok-text)}
.tip{border-left:6px solid var(--primary)}
.zhl{font-size:21px;line-height:1.5;color:var(--title)}
.pyl{font-size:14.5px;color:var(--primary-text)}
.rul{font-size:14.5px;color:var(--text2)}
.parts{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:2px dashed var(--line);font-size:14px}
.wl{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;padding:5px 0;border-bottom:2px solid var(--line);font-size:14px}
.wl:last-child{border-bottom:none}
.say{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--blue-lip)}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;color:var(--title)}
.timer.low{color:var(--bad-text)}
.paper{border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fffdf7;line-height:1.55}
.paper ol{margin:6px 0 0;padding-left:22px}
.paper li{margin-bottom:8px}

/* Ключи */
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.rc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:7px 6px;text-align:center;box-shadow:0 3px 0 var(--line)}
.rc .rn{font-size:11px;color:var(--text3);display:flex;justify-content:space-between}
.rc .han{font-size:30px;line-height:1.2;color:var(--title)}
.rc .rm{font-size:12px;line-height:1.25;color:var(--text2)}
.rc.learned{border-color:#a5ed6e;background:#f3ffe9}
.rc.due{border-color:#ffe28a}
.chgrid{display:flex;flex-wrap:wrap;gap:6px}
.chgrid button{font-size:26px;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);color:var(--title)}

/* Нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:2px solid var(--line);display:flex;max-width:600px;margin:0 auto;padding-bottom:var(--safe-b)}
body.focus .nav{display:none}
.nav button{flex:1;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--text3);font-size:10.5px;font-weight:900;letter-spacing:.02em;border-radius:14px;margin:6px 3px;border:2px solid transparent;min-width:0}
.nav button .ic{display:block;height:28px;transition:transform .15s}
.nav button .ic svg{display:block}
.nav button:not(.on) .ic{filter:saturate(.75);opacity:.85}
.nav button.on{color:var(--primary-text);background:var(--primary-soft);border-color:var(--primary-line)}
.nav button.on .ic{transform:scale(1.08)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--title);color:#fff;padding:11px 17px;border-radius:14px;
  font-size:13.5px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;font-weight:800}
.toast.on{opacity:1}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:2px solid var(--line);gap:12px}
.setrow:last-child{border-bottom:none}
.setrow .lab{min-width:0}
.setrow .lab b{font-size:14.5px;color:var(--title)}.setrow .lab small{display:block;color:var(--text3);font-size:12px;margin-top:2px;font-weight:700}
.stepper{display:flex;align-items:center;gap:10px;flex:none}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:18px;color:var(--blue-lip)}
.stepper b{min-width:28px;text-align:center;font-size:16px;font-weight:900;color:var(--title)}
select,input[type=date],input[type=text].inl,input[type=number].inl{background:var(--bg2);border:2px solid var(--line);color:var(--title);border-radius:10px;padding:8px;font-size:14px;max-width:190px;font-weight:700}
.switch{width:52px;height:30px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(22px)}
.seg2{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:62%}
.seg2 button{border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:900;color:var(--text2)}
.seg2 button.on{border-color:#84d8ff;background:var(--blue-soft);color:var(--blue-lip)}
.datechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.datechips button{border:2px solid #b9e6fb;background:var(--blue-soft);color:var(--blue-lip);border-radius:10px;padding:4px 8px;font-size:12.5px;font-weight:800}


/* Экран загрузки: оранжевый, как системная заставка (manifest background_color), маскот + название */
.splash{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 80% at 50% 30%,#ffb020 0%,#ff9600 55%,#f08400 100%);display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;text-align:center;transition:opacity .35s ease,visibility .35s;padding:24px}
.splash.out{opacity:0;visibility:hidden}
.spl-badge{width:168px;height:168px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 0 rgba(160,70,0,.28);animation:splhop 1.1s cubic-bezier(.3,1.4,.5,1) infinite alternate}
.spl-badge svg{width:132px;height:auto;margin-top:8px}
.spl-t{margin-top:28px;font:900 34px/1.1 Nunito,system-ui,sans-serif;letter-spacing:.01em;text-shadow:0 3px 0 rgba(160,70,0,.25)}
.spl-t .han{font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;margin-right:6px}
.spl-s{margin-top:8px;font:800 15px/1.35 Nunito,system-ui,sans-serif;opacity:.95}
.spl-bar{margin-top:34px;width:180px;height:14px;border-radius:8px;background:rgba(255,255,255,.35);overflow:hidden}
.spl-bar i{display:block;height:100%;width:40%;border-radius:8px;background:#fff;animation:splbar 1.1s ease-in-out infinite}
@keyframes splhop{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes splbar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="Загрузка">
  <div class="spl-badge"><svg class="spl-m" viewBox="8 4 104 76" width="140" height="102" aria-hidden="true"><path d="M16 40C10 20 18 8 32 9c8 .6 12 6 11 14z" fill="#f47a2c"/> <path d="M21 33C18 21 22 14 31 14.5c5 .4 7 4 6 9z" fill="#fff7ee"/> <path d="M24 31C23 24 25 19 30 19.5c3 .3 4 2.5 3.6 5z" fill="#5c2a18"/><path d="M104 40C110 20 102 8 88 9c-8 .6 -12 6 -11 14z" fill="#f47a2c"/> <path d="M99 33C102 21 98 14 89 14.5c-5 .4 -7 4 -6 9z" fill="#fff7ee"/> <path d="M96 31C97 24 95 19 90 19.5c-3 .3 -4 2.5 -3.6 5z" fill="#5c2a18"/> <rect x="12" y="15" width="96" height="63" rx="31.5" fill="#f47a2c"/> <rect x="34" y="21" width="15" height="7" rx="3.5" fill="#fff7ee"/><rect x="71" y="21" width="15" height="7" rx="3.5" fill="#fff7ee"/> <circle cx="25" cy="55" r="11" fill="#fff7ee"/><circle cx="95" cy="55" r="11" fill="#fff7ee"/> <rect x="41" y="44" width="38" height="28" rx="14" fill="#fff7ee"/> <path d="M43 48c-1 6 1 10 5 13M77 48c1 6-1 10-5 13" fill="none" stroke="#d9581c" stroke-width="3" stroke-linecap="round" opacity=".55"/> <path d="M36 42q7-10 14 0" fill="none" stroke="#2b1a12" stroke-width="4" stroke-linecap="round"/><path d="M70 42q7-10 14 0" fill="none" stroke="#2b1a12" stroke-width="4" stroke-linecap="round"/> <rect x="29" y="47" width="10" height="5" rx="2.5" fill="#ff8fa0" opacity=".75"/><rect x="81" y="47" width="10" height="5" rx="2.5" fill="#ff8fa0" opacity=".75"/> <path d="M54 50h12c1.6 0 2.4 1.9 1.2 3l-4.8 4.6a3.4 3.4 0 0 1-4.8 0L52.8 53c-1.2-1.1-.4-3 1.2-3z" fill="#2b1a12"/><path d="M51 59h18a9 9 0 0 1-18 0z" fill="#8a2c1a"/><path d="M55 64.5a5.5 3.5 0 0 0 10 0 9 9 0 0 1-10 0z" fill="#ff8fa0"/></svg></div>
  <div class="spl-t"><span class="han">朱</span>Ханьцзы</div>
  <div class="spl-s">иероглифы уроков 1–30 по Кондрашевскому</div>
  <div class="spl-bar"><i></i></div>
</div>
<div id="app">
  <header class="top">
    <button class="seal" id="logo" aria-label="Чжу — на главную"></button>
    <div class="daychip" id="dayChip">обычный день</div>
    <div class="spacer"></div>
    <button class="stat fire" id="stStreak" title="Серия дней"><span class="si"></span><span>0</span></button>
    <button class="stat ice" id="stFreeze" title="Заморозки серии"><span class="si"></span><span>0</span></button>
    <div class="ring" id="stRing" title="Дневная цель XP"></div>
  </header>
  <main id="screen"></main>
</div>
<nav class="nav" id="nav">
  <button data-nav="path" class="on"><span class="ic" data-ic="home"></span>Путь</button>
  <button data-nav="practice"><span class="ic" data-ic="dumbbell"></span>Повторение</button>
  <button data-nav="dict"><span class="ic" data-ic="book"></span>Словарь</button>
  <button data-nav="progress"><span class="ic" data-ic="trophy"></span>Прогресс</button>
  <button data-nav="settings"><span class="ic" data-ic="gear"></span>Настройки</button>
</nav>
<div class="fb" id="fb" hidden><div class="in" id="fbin"></div></div>
<div class="combopop" id="combopop"></div>
<div class="achpop" id="achpop"></div>
<canvas id="confetti" hidden></canvas>
<div class="sheet" id="sheet" hidden><div class="sheetc" id="sheetc"></div></div>
<div class="toast" id="toast"></div>

<script>
/*__JS__*/
</script>
